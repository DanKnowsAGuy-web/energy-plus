<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Energy Plus Diagnostic</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#174e58">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one instrument column; one question per screen; every answer draws an insight card; petrol frames the open and the readout. */
:root{
  --paper:#f3f5f6; --card:#ffffff; --ink:#101416; --body:#3b4347; --faint:#6b747a; --rule:#d3d9dd;
  --petrol:#174e58; --petrol-2:#1f5c67; --on-petrol:#ffffff; --on-petrol-dim:#b9d0d4; --ochre:#e0a21c;
  --sel:#e7eef0;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}



*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--body);font-family:var(--f-display);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:600px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--petrol-2);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{font-weight:800;font-stretch:112%;letter-spacing:-.01em;color:var(--ink);font-size:15px}
.brand span{color:var(--petrol-2)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--faint);letter-spacing:.06em}
.track{height:2px;background:var(--rule);position:relative;overflow:hidden;margin-bottom:28px}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--petrol-2);transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* screens */
.screen{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
.screen.leave{animation:leave .28s ease-in both}
@keyframes enter{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-14px)}}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
h1,h2{font-family:var(--f-display);font-stretch:112%;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6.4vw,40px);line-height:1.08}
h2{font-size:clamp(22px,4.8vw,28px);line-height:1.15}
.sub{margin:12px 0 0;max-width:60ch}

/* options */
.opts{display:grid;gap:0;margin-top:26px;border-top:1px solid var(--rule)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:17px 14px 17px 16px;cursor:pointer;color:var(--ink);font-size:17px;font-weight:500;position:relative;transition:background .2s}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--petrol-2);transition:width .25s}
.opt:hover{background:var(--sel)}
.opt:hover::before{width:3px}
.opt .hint{font-family:var(--f-mono);font-size:12px;color:var(--faint);font-weight:400;text-align:right}
.opt[disabled]{color:var(--faint);cursor:default}
.opt[disabled]:hover{background:none}.opt[disabled]:hover::before{width:0}
.opt.chosen{background:var(--sel)}
.opt.chosen::before{width:4px}
.opt.dim{opacity:.38}
.opts.locked .opt{pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;border-top:0;gap:0 18px}
.grid2 .opt:nth-child(1),.grid2 .opt:nth-child(2){border-top:1px solid var(--rule)}
@media (max-width:460px){.grid2{grid-template-columns:1fr}.grid2 .opt:nth-child(2){border-top:0}}

select.state{width:100%;margin-top:26px;font:inherit;font-size:17px;padding:15px 14px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:2px}
.field{display:grid;gap:6px;margin-top:18px}
.field label{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.field input{font:inherit;font-size:18px;padding:14px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:2px}
.err{color:#b4462f;font-size:14px;min-height:20px;margin-top:8px}

/* insight card */
.insight{margin-top:26px;background:var(--card);border-top:3px solid var(--petrol-2);padding:22px 20px 20px;box-shadow:0 1px 0 var(--rule),0 18px 40px -28px rgba(16,20,22,.45);
  animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
.insight .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--petrol-2);display:flex;align-items:center;gap:8px}
.insight .tag::before{content:"";width:18px;height:1px;background:currentColor;display:inline-block}
.insight h3{font-family:var(--f-display);font-stretch:108%;font-weight:700;color:var(--ink);font-size:21px;line-height:1.22;margin:12px 0 0;text-wrap:balance}
.insight p{margin:10px 0 0}
.insight .src{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-top:14px;letter-spacing:.02em}
.fig{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:16px}
.fig .big{font-family:var(--f-mono);font-size:44px;font-weight:600;color:var(--ink);letter-spacing:-.02em;line-height:1}
.fig .big.metered{color:var(--ochre)}
.fig .vs{font-family:var(--f-mono);font-size:13px;color:var(--faint)}
.bars{display:grid;gap:9px;margin-top:16px}
.brow{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;font-size:14px}
.brow .lbl{color:var(--body)}
.brow .bt{height:8px;background:var(--rule);position:relative;overflow:hidden}
.brow .bt i{position:absolute;inset:0 auto 0 0;width:0;background:var(--faint);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.brow.lead .bt i{background:var(--petrol-2)}
.brow .pv{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--ink)}
.next{margin-top:22px;display:flex;justify-content:flex-end}
.btn{background:var(--ink);color:var(--paper);border:0;padding:14px 22px;font-weight:600;font-size:16px;cursor:pointer;border-radius:2px;display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.btn:hover{background:var(--petrol-2);color:#fff}
.btn .ar{font-family:var(--f-mono)}
.link{background:none;border:0;color:var(--faint);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:0}

/* petrol instrument panels */
.panel{background:var(--petrol);color:var(--on-petrol);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:44px max(16px,env(safe-area-inset-left,0px)) 40px;position:relative;overflow:hidden}
.panel .in{max-width:600px;margin:0 auto;position:relative}
.panel h1,.panel h2{color:var(--on-petrol)}
.panel .eyebrow{color:var(--on-petrol-dim)}
.panel .sub{color:var(--on-petrol-dim)}
.panel .btn{background:var(--on-petrol);color:var(--petrol)}
.panel .btn:hover{background:var(--ochre);color:#101416}
.grat{position:absolute;inset:0;opacity:.18;background-image:repeating-linear-gradient(90deg,transparent 0 47px,rgba(255,255,255,.5) 47px 48px);mask-image:linear-gradient(180deg,transparent,#000 40%,transparent)}
.dial{display:flex;gap:22px;margin-top:28px;flex-wrap:wrap}
.dial div{font-family:var(--f-mono);font-size:12px;color:var(--on-petrol-dim);letter-spacing:.05em}
.dial b{display:block;font-size:20px;color:var(--on-petrol);font-weight:500;letter-spacing:0;margin-bottom:2px}

/* readout */
.readout .range{font-family:var(--f-mono);font-weight:600;font-size:clamp(34px,9vw,54px);letter-spacing:-.03em;line-height:1;margin-top:18px;color:var(--on-petrol)}
.readout .per{font-family:var(--f-mono);font-size:13px;color:var(--on-petrol-dim);margin-top:8px}
.ticks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:26px;background:rgba(255,255,255,.18);border-top:1px solid rgba(255,255,255,.18)}
.ticks div{background:var(--petrol);padding:14px 10px 4px 0}
.ticks b{display:block;font-family:var(--f-mono);font-size:19px;font-weight:500;color:var(--on-petrol)}
.ticks span{font-size:12px;color:var(--on-petrol-dim)}
@media (max-width:460px){.ticks{grid-template-columns:1fr}}
.blocks{display:grid;gap:30px;margin-top:34px}
.blk h2{font-size:22px}
.finds{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:0;border-top:1px solid var(--rule)}
.finds li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:14px 0;border-bottom:1px solid var(--rule);animation:enter .6s cubic-bezier(.2,.8,.2,1) both}
.finds .n{font-family:var(--f-mono);font-size:13px;color:var(--petrol-2);padding-top:2px}
.finds strong{color:var(--ink);font-weight:600;display:block}
.kv{display:grid;gap:0;margin-top:14px;border-top:1px solid var(--rule)}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.kv b{font-family:var(--f-mono);font-weight:500;color:var(--ink);white-space:nowrap}
.assume{font-size:14px;color:var(--faint)}
.assume ul{padding-left:18px;margin:8px 0 0}
.cta{display:grid;gap:12px;margin-top:6px}
.num{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:15px;color:var(--ink)}
.copy{background:none;border:1px solid var(--rule);padding:6px 10px;font-family:var(--f-mono);font-size:12px;cursor:pointer;color:var(--body);border-radius:2px}
.note{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-top:16px;letter-spacing:.02em}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}

.blk .kv span{color:var(--body)}
.bar-l{display:flex;align-items:center;gap:14px}
.back{background:none;border:1px solid var(--rule);border-radius:999px;padding:6px 12px 6px 10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--ink);cursor:pointer}
.back:hover{border-color:var(--petrol-2);color:var(--petrol-2)}
.back[hidden]{display:none}
.opt.dim{opacity:1}
.opt.chosen::after{content:"\2713";font-family:var(--f-mono);color:var(--petrol-2);margin-left:10px}
/* readable at 65+: nothing under 15px, body copy 19 to 20px */
body{font-size:19px;line-height:1.55}
.wrap{max-width:640px}
h1{font-size:clamp(30px,6.6vw,44px);line-height:1.1}
h2{font-size:clamp(25px,5vw,32px)}
.sub{font-size:20px;line-height:1.5;color:var(--body)}
.count{font-size:15px}
.back{font-size:15px;padding:8px 14px 8px 12px}
.opt{font-size:20px;padding:20px 16px}
.opt .hint{font-size:15px}
.insight{padding:24px 22px 22px}
.insight h3{font-size:24px;line-height:1.25}
.insight p{font-size:19px;line-height:1.5}
.insight .src{font-size:14px;margin-top:16px;line-height:1.45}
.next{margin-top:20px}
.btn{font-size:19px;padding:16px 26px}
.brow{grid-template-columns:minmax(120px,170px) 1fr 58px;font-size:18px;gap:12px}
.brow .bt{height:10px}
.brow .pv{font-size:17px}
.fig .big{font-size:48px}
.fig .vs{font-size:16px}
select.state{font-size:20px;padding:16px}
.field label{font-size:15px}
.field input{font-size:20px;padding:16px}
.err{font-size:16px}
.change-hint{font-family:var(--f-mono);font-size:15px;color:var(--faint);margin-top:12px}
.readout .per{font-size:17px;line-height:1.5}
.ticks b{font-size:23px}
.ticks span{font-size:15px}
.kv div{font-size:18px;padding:14px 0}
.kv b{font-size:18px}
.finds li{font-size:18px;grid-template-columns:40px 1fr}
.finds .n{font-size:15px}
.assume{font-size:17px}
.assume li{margin-top:6px}
.num{font-size:18px}
.copy{font-size:15px;padding:8px 12px}
.link{font-size:17px}
.panel h2{font-size:clamp(25px,5vw,32px)}

/* Watt, the avatar */
:root{--watt-body:var(--petrol);--watt-eye:#ffffff}


.watt{display:block;overflow:visible}
.watt .w-body{fill:var(--watt-body);stroke:var(--watt-body)}
.watt .w-eye{fill:var(--watt-eye)}
.watt .w-acc{fill:var(--ochre);transition:opacity .35s ease}
.watt.on-petrol{--watt-body:#ffffff;--watt-eye:var(--petrol)}

/* ---------- the conversation: Watt asks, you reply, Watt answers ---------- */
.track{margin-bottom:8px}
.convo{display:flex;flex-direction:column;align-items:center}
.watt-seat{position:relative;width:clamp(104px,24vw,140px);margin:8px auto 0;z-index:2}
.watt-seat svg{width:100%;height:auto}
.watt-seat.talk{animation:talk .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes talk{0%{transform:scale(1)}40%{transform:scale(1.07) translateY(-3px)}100%{transform:scale(1)}}
#app{width:100%}
.turn{display:flex;flex-direction:column}

.bubble{background:var(--card);border-radius:22px;padding:26px 26px 24px;position:relative;box-shadow:0 1px 0 var(--rule),0 22px 44px -30px rgba(16,20,22,.45)}
.bubble .eyebrow{margin:0 0 10px;color:var(--petrol-2);font-size:15px}
.bubble.ask{margin-top:18px;text-align:center;border:1px solid var(--rule)}
.bubble.ask::before{content:"";position:absolute;top:-11px;left:50%;width:22px;height:22px;background:var(--card);border-left:1px solid var(--rule);border-top:1px solid var(--rule);transform:translateX(-50%) rotate(45deg);border-top-left-radius:4px}
.bubble.ask h1{font-size:clamp(27px,5.6vw,38px);line-height:1.14}
.bubble.ask .sub{margin:12px auto 0}
.bubble.say{margin-top:18px;align-self:flex-start;max-width:100%;border-top-left-radius:6px;border:1px solid var(--rule);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.bubble.say h3{font-family:var(--f-display);font-stretch:108%;font-weight:700;color:var(--ink);font-size:24px;line-height:1.25;margin:0;text-wrap:balance}
.bubble.say p{margin:10px 0 0;font-size:19px;line-height:1.5}
.bubble.say .shown{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.bubble.say .src{font-family:var(--f-mono);font-size:15px;color:var(--faint);margin-top:16px;line-height:1.45}
.bubble.typing{display:flex;gap:7px;padding:20px 22px;width:auto}
.bubble.typing i{width:10px;height:10px;border-radius:50%;background:var(--faint);animation:dot 1s infinite ease-in-out}
.bubble.typing i:nth-child(2){animation-delay:.15s}.bubble.typing i:nth-child(3){animation-delay:.3s}
.bubble.typing.slow{align-self:center}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

/* replies: big tap targets; once chosen, the reply sits on your side */
.turn .opts{border-top:0;gap:10px;margin-top:20px}
.turn .opt{border:1px solid var(--rule);border-radius:16px;background:var(--card);padding:19px 20px;font-size:20px;justify-content:space-between;transition:background .2s,border-color .2s,transform .15s}
.turn .opt::before{display:none}
.turn .opt:hover{background:var(--sel);border-color:var(--petrol-2)}
.turn .opt:active{transform:scale(.98)}
.turn .grid2{gap:10px}
.turn .grid2 .opt:nth-child(1),.turn .grid2 .opt:nth-child(2){border-top:1px solid var(--rule)}
.turn .opts.answered{display:flex;justify-content:flex-end;margin-top:16px}
.turn .opts.answered .opt{display:none}
.turn .opts.answered .opt.chosen{display:flex;width:auto;max-width:85%;background:var(--petrol);border-color:var(--petrol);color:#fff;border-radius:22px 22px 6px 22px;padding:15px 22px;cursor:default;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.turn .opts.answered .opt.chosen .hint{color:#b9d0d4}
.turn .opts.answered .opt.chosen::after{content:none}
.turn .change{align-self:flex-end;margin-top:8px;font-size:16px}
.turn .opts.multi .opt.chosen{background:var(--sel);border-color:var(--petrol-2)}
.turn .opts.multi .opt.chosen::after{content:"\2713";font-family:var(--f-mono);color:var(--petrol-2);margin-left:10px}
.turn .opts.answered{flex-wrap:wrap;gap:8px}
.turn .done-row{justify-content:flex-end}
.turn .done-row[hidden]{display:none}
.btn[disabled]{opacity:.4;cursor:default}
/* region picker: tap a region for all its states, tap a state to add or remove */
.regions{display:grid;gap:12px;margin-top:20px}
.region{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px}
.reg-h{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;padding:4px 4px 10px;cursor:pointer;font-size:20px;font-weight:700;color:var(--ink);font-stretch:108%}
.reg-all{font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--petrol-2);border:1px solid var(--rule);border-radius:999px;padding:6px 12px}
.reg-h.on .reg-all{background:var(--petrol);border-color:var(--petrol);color:#fff}
.reg-states{display:flex;flex-wrap:wrap;gap:8px}
.st{font-size:17px;padding:9px 14px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.st.on{background:var(--petrol);border-color:var(--petrol);color:#fff}
.regions.answered .st:not(.on){display:none}
.regions.answered .reg-all{display:none}
.regions.answered .region:not(:has(.st.on)){display:none}
.picked{margin-right:auto;font-size:16px;color:var(--faint);align-self:center}
.done-row{position:sticky;bottom:96px;background:color-mix(in srgb,var(--paper) 90%,transparent);padding:10px 0;z-index:3}
.turn .opts.multi.answered .opt.chosen{background:var(--petrol);border-color:var(--petrol);color:#fff}
.turn .opts.multi.answered .opt.chosen::after{content:none}
.turn select.state{border-radius:16px;margin-top:20px}
.turn .next{margin-top:20px}
.turn .next.start{justify-content:center;margin-top:26px}
.turn .field{margin-top:16px}
.btn{border-radius:999px}

/* the "Your building" strip */
.profile{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.profile[hidden]{display:none}
.profile .wrap{display:flex;align-items:center;gap:12px}
.p-lbl{font-family:var(--f-mono);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:16px;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--rule);color:var(--ink);white-space:nowrap}
.chip.new{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;border-color:var(--petrol-2)}
body.has-profile{padding-bottom:110px}
html:has(body.has-profile){scroll-padding-bottom:120px}

/* readout and call to action */
.readout .panel{margin-top:22px}
.verify-row{display:flex;align-items:center;gap:16px;margin-top:18px;padding:14px 16px;background:var(--card);border-left:3px solid var(--ochre);border-radius:4px 16px 16px 4px}
.verify-row p{margin:0;font-size:18px;line-height:1.45;color:var(--ink)}
.verify-row span{flex:0 0 auto}


.brand{display:inline-flex;align-items:center;line-height:0}
.brand .logo{height:28px;width:auto;display:block}
.brand .logo-white{display:none}



/* ---------- chat shell: Watt in the header, the conversation in the middle, one solid dock at the bottom ---------- */
body{padding-block:0}
.top{position:sticky;top:0;z-index:10;background:var(--paper);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));box-shadow:0 1px 0 var(--rule)}
.top .bar{display:flex;align-items:center;gap:12px;padding-block:10px 8px}
.top .back{border-radius:999px;width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:20px;flex:0 0 auto}

/* the conversation builds up like a chat; earlier turns stay, quieter */

.turn .bubble.ask::before{display:none}

.replypill{align-self:flex-end;margin-top:16px;background:var(--petrol);color:#fff;border-radius:22px 22px 6px 22px;padding:15px 22px;font-size:20px;max-width:85%}

/* the dock: the action and "Your building" in one solid footer */
.profile{display:none}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);box-shadow:0 -1px 0 var(--rule),0 -12px 28px -20px rgba(16,20,22,.35);padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}

.dock[data-empty]{display:none}
.act{display:flex;align-items:center;gap:12px}

.act .picked{margin-right:auto;font-family:var(--f-mono);font-size:16px;color:var(--faint)}
.act .hint{font-size:17px;color:var(--faint)}
.prof{display:flex;align-items:center;gap:12px}
.done-row{display:none}
.turn > .next{display:none}
.readout .panel{margin-top:16px}
body.has-profile{padding-bottom:0}
html:has(body.has-profile){scroll-padding-bottom:0}

/* ---------- Watt sits in the conversation, beside what he says ---------- */
.top .bar{padding-block:8px 6px;min-height:56px}
.top .brand{margin-right:auto}
.top .count{font-family:var(--f-mono);font-size:15px;color:var(--faint)}
.turn{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;align-items:start}
.turn > .gutter{grid-column:1;grid-row:1 / span 50;align-self:stretch}
.turn > .tbody{grid-column:2;display:flex;flex-direction:column;min-width:0}
.avatar-slot{position:sticky;top:calc(var(--toph,60px) + 10px);width:44px;height:44px}
.watt-live{display:block;width:44px;height:44px}
.watt-live svg{width:100%;height:100%}
.watt-live.talk{animation:talk .42s cubic-bezier(.3,1.6,.5,1)}
.turn.past .avatar-slot{opacity:0}
.say-row{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;align-items:start;padding-top:18px}
.say-row .bubble.ask{margin-top:0;text-align:left;border-top-left-radius:6px}
.say-row .bubble.ask::before{display:none}
.say-row .bubble.ask .sub{margin:12px 0 0}
@media (min-width:700px){.turn,.say-row{grid-template-columns:52px minmax(0,1fr)}.avatar-slot,.watt-live{width:52px;height:52px}}
@media (max-width:460px){.turn,.say-row{grid-template-columns:36px minmax(0,1fr);column-gap:8px}.avatar-slot,.watt-live{width:36px;height:36px}.bubble{padding:20px 18px 18px}}

/* the dock: one slim row, only when there's something to press */
.dock{padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.dock .wrap{gap:0}
.act .btn{min-width:0;padding:12px 24px;font-size:18px}
.prof{display:none!important}
/* what they told Watt, shown once at the end */
.told{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.told .chip{white-space:normal}
@media (max-width:460px){.brow{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 46px;font-size:17px}}

/* ---------- Watt in the conversation: above his message, like a messenger name line ---------- */
.turn{display:flex;flex-direction:column;align-items:stretch}
.turn > .replypill,.turn > .change{align-self:flex-end}
.turn > .opts.answered{align-self:stretch}
.reg-h{text-align:left;gap:12px}
.reg-all{white-space:nowrap}
.wattline{display:flex;align-items:center;gap:12px}
.wattline .watt-live{width:var(--av,60px);height:var(--av,60px);flex:0 0 auto}
.watt-live svg{width:100%;height:100%;display:block}
.wname{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.wname b{font-size:19px;font-weight:700;color:var(--ink);font-stretch:108%}
.wstat{font-family:var(--f-mono);font-size:15px;color:var(--petrol-2)}
.top .mini{width:36px;height:36px;display:none}
.top .mini.on{display:block}
/* a: Watt above his message, like a messenger name line */
body.look-a{--av:64px}
body.look-a .wattline{margin:0 0 10px}

.readout .bubble.ask{text-align:left;border-top-left-radius:6px}
.readout .bubble.ask::before{display:none}
.readout .bubble.ask .sub{margin:12px 0 0}
/* sources as quiet fine print */
.bubble.say .src,.insight .src{font-size:12px;line-height:1.4;opacity:.7;margin-top:12px;letter-spacing:0}
/* the teaser list before the phone number */
.tease{margin:14px 0 0;padding-left:24px;display:grid;gap:8px;font-size:19px;color:var(--ink);font-weight:600}
.tease li::marker{color:var(--ochre);font-family:var(--f-mono)}

/* motion: the demand charge */
.dviz{margin-top:6px}
.dviz svg{width:100%;height:auto;display:block;overflow:visible}
.dviz svg *{animation-play-state:paused}
.dviz.play svg *{animation-play-state:running}
.dv-axis{stroke:var(--rule);stroke-width:2}
.dv-line{fill:none;stroke:var(--petrol-2);stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dvDraw 1.7s .2s cubic-bezier(.4,0,.2,1) forwards}
.dv-dot{fill:var(--ochre);opacity:0;animation:dvPop .5s 1.75s cubic-bezier(.3,1.6,.5,1) forwards}
.dv-ruler{stroke:var(--ochre);stroke-width:2.5;stroke-dasharray:7 5;transform:scaleX(0);transform-box:view-box;animation:dvStretch .9s 2.35s cubic-bezier(.2,.8,.2,1) forwards}
.dv-band{fill:var(--ochre);opacity:0;animation:dvBand .7s 3.15s ease forwards}
.dviz text{font-family:var(--f-display);font-size:15px;font-weight:700;opacity:0}
.dv-t1{fill:var(--ochre);animation:dvFade .4s 1.95s ease forwards}
.dv-t2{fill:var(--ink);animation:dvFade .5s 3.25s ease forwards}
.dv-t3{animation-delay:3.45s}
.dviz .dv-day{font-family:var(--f-mono);font-size:13px;font-weight:500;fill:var(--faint);opacity:1}
.dv-replay{font-size:15px;margin-top:4px}
@keyframes dvDraw{to{stroke-dashoffset:0}}
@keyframes dvPop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
@keyframes dvStretch{to{transform:scaleX(1)}}
@keyframes dvBand{to{opacity:.14}}
@keyframes dvFade{to{opacity:1}}

/* motion: shared */
:root{--cold:#3d8fb5;--warm:#c8553d}


.dviz svg .cv-a,.dviz svg .cv-b,.dviz svg .cv-c,.dviz svg .cs-t1,.dviz svg .cs-t2,.dviz svg .cs-t3,.dviz svg .dp-t1,.dviz svg .dp-t2,.dviz svg .dp-t3,.dviz svg .dp-t4{font-family:var(--f-display);font-size:15px;font-weight:700;opacity:0}
.finds .dviz{margin-top:10px}
/* coil */
.cv-fin{stroke:var(--faint);stroke-width:3;stroke-linecap:round}
.cv-wall{fill:none;stroke:var(--petrol-2);stroke-width:8}
.cv-in{fill:var(--cold);opacity:.18}
.cv-oil{fill:none;stroke:#8a5a14;stroke-width:0;opacity:.9;animation:cvGrow 1.9s .8s cubic-bezier(.4,0,.2,1) forwards}
.cv-heat{fill:none;stroke:var(--warm);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transform-box:view-box;animation:cvShrink 1.4s 2.3s ease forwards}
.cv-a{fill:var(--faint);animation:dvFade .5s .3s ease forwards}
.cv-b{fill:var(--ink);animation:dvFade .5s 2.1s ease forwards}
.cv-c{fill:var(--warm);animation:dvFade .5s 3.5s ease forwards}
@keyframes cvGrow{to{stroke-width:30}}
@keyframes cvShrink{to{transform:scale(.82);opacity:.25}}
/* open cases */
.cs-case{fill:var(--card);stroke:var(--petrol-2);stroke-width:2.5}
.cs-shelf{stroke:var(--rule);stroke-width:2}
.cs-vent{fill:var(--petrol-2)}
.cs-floor{stroke:var(--rule);stroke-width:2}
.cs-cold{fill:none;stroke:var(--cold);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dvDraw 1.4s cubic-bezier(.4,0,.2,1) forwards}
.cs-warm{fill:none;stroke:var(--warm);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dvDraw .9s ease forwards}
.cs-t1{fill:var(--cold);animation:dvFade .5s 1s ease forwards}
.cs-t2{fill:var(--warm);animation:dvFade .5s 2.2s ease forwards}
.cs-t3{fill:var(--ink);font-size:16px!important;animation:dvFade .5s 3s ease forwards}
/* dirty power */
.dp-axis{stroke:var(--rule);stroke-width:1.5}
.dp-clean{fill:none;stroke:var(--petrol-2);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:dvDraw 1.2s .2s ease forwards,dpDim .6s 1.9s ease forwards}
.dp-dirty{fill:none;stroke:var(--warm);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:dvDraw 1.3s 1.9s ease forwards}
.dp-t1{fill:var(--petrol-2);animation:dvFade .4s .3s ease forwards,dpOut .3s 1.8s ease forwards}
.dp-t2{fill:var(--warm);animation:dvFade .4s 2s ease forwards}
.dp-motor{fill:none;stroke:var(--petrol-2);stroke-width:4}
.dp-glow{fill:var(--warm);opacity:0;transform-box:view-box;animation:dpGlow 1.2s 2.8s ease forwards}
.dp-t3{fill:var(--ink);animation:dvFade .5s 3s ease forwards}
.dp-t4{fill:var(--ink);animation:dvFade .5s 3.3s ease forwards}
@keyframes dpDim{to{opacity:.18}}
@keyframes dpOut{to{opacity:0}}
@keyframes dpGlow{0%{opacity:0;transform:scale(.6)}100%{opacity:.35;transform:scale(1)}}

.finds .fval{display:block;font-family:var(--f-mono);font-size:17px;font-weight:600;color:var(--ochre);margin:2px 0 4px}
.finds .fpct{display:block;font-family:var(--f-sans,inherit);font-size:16px;font-weight:700;color:var(--petrol,#174e58);margin-top:2px}
/* the human verifier */
.verifier{display:flex;gap:16px;align-items:flex-start;margin-top:18px;padding:16px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--ochre);border-radius:6px 18px 18px 6px}
.vf-pics{position:relative;flex:0 0 auto;width:72px;height:72px}
.vf-pics img{width:72px;height:72px;border-radius:50%;object-fit:cover;display:block}
.vf-watt{position:absolute;right:-10px;bottom:-8px;width:34px;height:34px;background:var(--card);border-radius:50%;padding:2px}

/* replies texted in two parts; quiet one-liners */
.bubble.say.cont{margin-top:8px;border-top-left-radius:18px}

/* why I'm asking */
.whyask{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:none;border:0;padding:4px 0;font-family:var(--f-mono);font-size:15px;color:var(--petrol-2);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.drow{display:flex;align-items:center;gap:12px}

.askw{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto;background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:10px 16px 10px 10px;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer}
.askw-i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--petrol);color:#fff;font-family:var(--f-mono);font-size:15px}

.ask-in{background:var(--paper);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;animation:rise .35s cubic-bezier(.2,.8,.2,1) both;max-width:none}

/* buildings like theirs */

@keyframes cmpGrow{from{transform:scaleX(0)}}

/* light mode only: it should feel like a chat */
:root{color-scheme:light}

.bubble.say.resume{margin-top:14px}

/* larger text */
.bigtxt{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--card);font-weight:800;font-size:17px;color:var(--ink);cursor:pointer;margin-left:10px}

<template id="disc-tpl"><p><em>Effective date: October 31, 2026.</em> These disclosures apply to Energy Plus marketing and informational materials, including videos, presentations, web pages, and printed materials. They explain the basis for the statements, figures, and offers presented in those materials. By viewing or relying on those materials, you acknowledge these disclosures. Where a signed agreement exists, that agreement governs.</p>
        <h4>1. General</h4>
        <p>This content is provided for general informational purposes only. It is not an offer, warranty, guarantee, or professional advice. All figures are estimates, are illustrative, and are subject to change without notice. The only binding commitments between you and Energy Plus are those set out in a signed written agreement. Results vary by facility.</p>
        <h4>2. Performance figures</h4>
        <p>Stated efficiency and savings ranges, including but not limited to 15 to 30 percent, 30 to 50 percent, 20 to 55 percent of the heating-and-cooling portion of a bill, up to 24 percent, an IEER of 31, a COP of 6, and more than 10 degrees, reflect results observed under specific conditions or reported in specific studies. Where a range is quoted for combined measures, the low end reflects the outcomes we treat as the planning floor and the high end requires per-site modeling. Actual performance depends on factors including equipment type, equipment age, baseline efficiency, climate, occupancy, usage patterns, maintenance, and installation quality. Your actual results may differ from, and may fall below, the ranges shown.</p>
        <h4>3. System and technical statements</h4>
        <p>Descriptions of how heating and cooling systems operate, including any statement that the compressor accounts for a majority or a stated share of system energy use, are typical or representative rather than universal. Actual values vary by system design, configuration, and operation.</p>
        <h4>4. Savings and return on investment</h4>
        <p>Any savings, payback period, or return on investment figure is an estimate based on assumptions that may not reflect the conditions at your facility. It is not a guarantee of any specific financial outcome. Modeled results and prior results do not predict future performance.</p>
        <h4>5. Cash flow and program cost</h4>
        <p>Statements that a project can be cash-flow positive from day one, or that incentives can cover a significant share of a program, describe outcomes that are achievable only under certain financing structures, utility rates, program eligibility, and tax positions. These outcomes are not available in all cases and are not promised for any particular customer. Cash flow timing runs from install, where the numbers support it. Savings, financing terms, and incentive eligibility depend on your building, utility, and state, and are confirmed during the diagnosis.</p>
        <h4>6. Tax credits, deductions, and rebates</h4>
        <p>The availability, amounts, and eligibility requirements of tax deductions, tax credits, and utility rebates depend on jurisdiction, current law, program funding, and your individual tax situation. Programs change and may end without notice. Energy Plus does not provide tax, accounting, or legal advice and does not guarantee that any incentive will be approved or received. Consult your own qualified advisor regarding your specific circumstances.</p>
        <h4>7. Measurement and verification</h4>
        <p>Independent measurement and verification of results, including under recognized protocols such as the International Performance Measurement and Verification Protocol (IPMVP) Option C and ASHRAE Guideline 14, is available upon request on qualifying projects. Where performed, verification confirms measured results for that specific project only and does not guarantee future results or results at any other site.</p>
        <h4>8. Third-party evaluations and named organizations</h4>
        <p>References to NASA, Durham College, named utilities, and other organizations reflect publicly available reports and evaluations concerning the underlying technologies that Energy Plus deploys. They do not refer to Energy Plus itself. Such references are provided for identification and descriptive purposes only and do not constitute or imply endorsement, sponsorship, certification, or affiliation by those organizations with Energy Plus, unless expressly stated in writing.</p>
        <h4>9. Case studies and references</h4>
        <p>Case studies, study counts, and climate or geographic references reflect specific installations completed under specific conditions. They are illustrative and are not predictive of the results you will achieve at your facility.</p>
        <h4>10. Third-party products and trademarks</h4>
        <p>Certain technologies referenced are manufactured or supplied by third parties. All product names, logos, and trademarks are the property of their respective owners. Specifications are subject to change without notice.</p>
        <h4>11. Equipment life and maintenance</h4>
        <p>Statements regarding extended equipment life, reduced maintenance, improved humidity control, and single-application or long-lasting benefits assume proper installation, operation, and maintenance. They are not a warranty, and actual outcomes will vary. Warranty terms, if any, are provided separately in writing.</p>
        <h4>12. Forward-looking statements</h4>
        <p>Statements about future benefits, savings, performance, and outcomes are forward-looking and inherently uncertain. Actual results may differ materially from those expressed or implied.</p>
        <h4>13. Not professional advice; assessment required</h4>
        <p>The information presented is general and educational in nature. It is not engineering, financial, tax, or legal advice for your specific situation. A formal assessment of your facility is required before any specific recommendation, scope, or projected result can be provided.</p>
        <h4>14. Analogies</h4>
        <p>References to diagnosis, examinations, prescriptions, or disease are analogies used to describe the energy assessment process. They are not medical statements and are not intended to convey any medical meaning.</p>
        <h4>15. Program terms, eligibility, and &ldquo;no cost&rdquo;</h4>
        <p>Our done-for-you program, including negotiation, pricing, and contract terms, is offered case-by-case and depends on factors such as the number of facilities in your portfolio and the size of your electricity bills. Properties that do not qualify for the done-for-you program may instead be offered self-directed options, which carry different terms, pricing, and responsibilities. &ldquo;Free,&rdquo; &ldquo;no cost,&rdquo; &ldquo;the diagnosis is on us,&rdquo; and &ldquo;nothing owed&rdquo; describe the diagnosis and pilot phase for qualifying properties; they do not describe the cost of any installed solution. Eligibility, scheduling, and availability are determined during the application and diagnosis process.</p>
        <h4>16. Professional history and credentials</h4>
        <p>Biographical and credential statements reflect documented professional history. Supporting documentation is available for verification on request.</p>
