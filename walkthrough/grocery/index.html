  --petrol:#123f47; --petrol-2:#1f5c67; --on-petrol:#ffffff; --on-petrol-dim:#a9c4c9; --ochre:#e8ad2c; --sel:#1b2629; color-scheme:dark}}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--body);font-family:var(--f-display);font-size:16px;line-height:1.55;

.wrap{max-width:600px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--petrol-2);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{font-weight:800;font-stretch:112%;letter-spacing:-.01em;color:var(--ink);font-size:15px}

.track{height:2px;background:var(--rule);position:relative;overflow:hidden;margin-bottom:28px}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--petrol-2);transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* screens */
.screen{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
.screen.leave{animation:leave .28s ease-in both}
@keyframes enter{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-14px)}}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
h1,h2{font-family:var(--f-display);font-stretch:112%;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6.4vw,40px);line-height:1.08}
h2{font-size:clamp(22px,4.8vw,28px);line-height:1.15}
.sub{margin:12px 0 0;max-width:60ch}

/* options */
.opts{display:grid;gap:0;margin-top:26px;border-top:1px solid var(--rule)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:17px 14px 17px 16px;cursor:pointer;color:var(--ink);font-size:17px;font-weight:500;position:relative;transition:background .2s}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--petrol-2);transition:width .25s}
.opt:hover{background:var(--sel)}
.opt:hover::before{width:3px}
.opt .hint{font-family:var(--f-mono);font-size:12px;color:var(--faint);font-weight:400;text-align:right}
.opt[disabled]{color:var(--faint);cursor:default}
.opt[disabled]:hover{background:none}.opt[disabled]:hover::before{width:0}
.opt.chosen{background:var(--sel)}
.opt.chosen::before{width:4px}
.opt.dim{opacity:.38}
.opts.locked .opt{pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;border-top:0;gap:0 18px}
.grid2 .opt:nth-child(1),.grid2 .opt:nth-child(2){border-top:1px solid var(--rule)}
@media (max-width:460px){.grid2{grid-template-columns:1fr}.grid2 .opt:nth-child(2){border-top:0}}

select.state{width:100%;margin-top:26px;font:inherit;font-size:17px;padding:15px 14px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:2px}
.field{display:grid;gap:6px;margin-top:18px}
.field label{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.field input{font:inherit;font-size:18px;padding:14px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:2px}
.err{color:#b4462f;font-size:14px;min-height:20px;margin-top:8px}

/* insight card */
.insight{margin-top:26px;background:var(--card);border-top:3px solid var(--petrol-2);padding:22px 20px 20px;box-shadow:0 1px 0 var(--rule),0 18px 40px -28px rgba(16,20,22,.45);
  animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
.insight .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--petrol-2);display:flex;align-items:center;gap:8px}
.insight .tag::before{content:"";width:18px;height:1px;background:currentColor;display:inline-block}
.insight h3{font-family:var(--f-display);font-stretch:108%;font-weight:700;color:var(--ink);font-size:21px;line-height:1.22;margin:12px 0 0;text-wrap:balance}
.insight p{margin:10px 0 0}
.insight .src{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-top:14px;letter-spacing:.02em}
.fig{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:16px}
.fig .big{font-family:var(--f-mono);font-size:44px;font-weight:600;color:var(--ink);letter-spacing:-.02em;line-height:1}
.fig .big.metered{color:var(--ochre)}
.fig .vs{font-family:var(--f-mono);font-size:13px;color:var(--faint)}
.bars{display:grid;gap:9px;margin-top:16px}
.brow{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;font-size:14px}
.brow .lbl{color:var(--body)}
.brow .bt{height:8px;background:var(--rule);position:relative;overflow:hidden}
.brow .bt i{position:absolute;inset:0 auto 0 0;width:0;background:var(--faint);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.brow.lead .bt i{background:var(--petrol-2)}
.brow .pv{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--ink)}
.next{margin-top:22px;display:flex;justify-content:flex-end}
.btn{background:var(--ink);color:var(--paper);border:0;padding:14px 22px;font-weight:600;font-size:16px;cursor:pointer;border-radius:2px;display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.btn:hover{background:var(--petrol-2);color:#fff}
.btn .ar{font-family:var(--f-mono)}
.link{background:none;border:0;color:var(--faint);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:0}

/* petrol instrument panels */
.panel{background:var(--petrol);color:var(--on-petrol);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:44px max(16px,env(safe-area-inset-left,0px)) 40px;position:relative;overflow:hidden}
.panel .in{max-width:600px;margin:0 auto;position:relative}
.panel h1,.panel h2{color:var(--on-petrol)}
.panel .eyebrow{color:var(--on-petrol-dim)}
.panel .sub{color:var(--on-petrol-dim)}
.panel .btn{background:var(--on-petrol);color:var(--petrol)}
.panel .btn:hover{background:var(--ochre);color:#101416}
.grat{position:absolute;inset:0;opacity:.18;background-image:repeating-linear-gradient(90deg,transparent 0 47px,rgba(255,255,255,.5) 47px 48px);mask-image:linear-gradient(180deg,transparent,#000 40%,transparent)}
.dial{display:flex;gap:22px;margin-top:28px;flex-wrap:wrap}
.dial div{font-family:var(--f-mono);font-size:12px;color:var(--on-petrol-dim);letter-spacing:.05em}
.dial b{display:block;font-size:20px;color:var(--on-petrol);font-weight:500;letter-spacing:0;margin-bottom:2px}

/* readout */
.readout .range{font-family:var(--f-mono);font-weight:600;font-size:clamp(34px,9vw,54px);letter-spacing:-.03em;line-height:1;margin-top:18px;color:var(--on-petrol)}
.readout .per{font-family:var(--f-mono);font-size:13px;color:var(--on-petrol-dim);margin-top:8px}
.ticks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:26px;background:rgba(255,255,255,.18);border-top:1px solid rgba(255,255,255,.18)}
.ticks div{background:var(--petrol);padding:14px 10px 4px 0}
.ticks b{display:block;font-family:var(--f-mono);font-size:19px;font-weight:500;color:var(--on-petrol)}
.ticks span{font-size:12px;color:var(--on-petrol-dim)}
@media (max-width:460px){.ticks{grid-template-columns:1fr}}
.blocks{display:grid;gap:30px;margin-top:34px}
.blk h2{font-size:22px}
.finds{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:0;border-top:1px solid var(--rule)}
.finds li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:14px 0;border-bottom:1px solid var(--rule);animation:enter .6s cubic-bezier(.2,.8,.2,1) both}
.finds .n{font-family:var(--f-mono);font-size:13px;color:var(--petrol-2);padding-top:2px}
.finds strong{color:var(--ink);font-weight:600;display:block}
.kv{display:grid;gap:0;margin-top:14px;border-top:1px solid var(--rule)}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.kv b{font-family:var(--f-mono);font-weight:500;color:var(--ink);white-space:nowrap}
.assume{font-size:14px;color:var(--faint)}
.assume ul{padding-left:18px;margin:8px 0 0}
.cta{display:grid;gap:12px;margin-top:6px}
.num{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:15px;color:var(--ink)}
.copy{background:none;border:1px solid var(--rule);padding:6px 10px;font-family:var(--f-mono);font-size:12px;cursor:pointer;color:var(--body);border-radius:2px}
.note{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-top:16px;letter-spacing:.02em}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>

var STATES={"Alabama":[14.77,3.2],"Alaska":[22.79,3.4],"Arizona":[12.22,-1.8],"Arkansas":[11.34,7.8],"California":[27.00,5.4],"Colorado":[13.14,9.0],"Connecticut":[21.69,-7.3],"Delaware":[13.61,7.9],"District of Columbia":[22.92,20.3],"Florida":[11.74,4.1],"Georgia":[11.76,3.2],"Hawaii":[40.31,10.8],"Idaho":[9.62,4.7],"Illinois":[13.81,9.0],"Indiana":[13.81,3.5],"Iowa":[11.28,4.9],"Kansas":[11.60,3.9],"Kentucky":[12.37,5.9],"Louisiana":[11.50,4.2],"Maine":[22.22,10.8],"Maryland":[16.61,18.5],"Massachusetts":[24.17,7.6],"Michigan":[15.34,7.4],"Minnesota":[12.56,3.0],"Mississippi":[13.77,7.0],"Missouri":[10.91,5.2],"Montana":[12.67,8.2],"Nebraska":[8.88,5.5],"Nevada":[9.34,-0.2],"New Hampshire":[21.12,6.4],"New Jersey":[17.39,8.6],"New Mexico":[10.94,0.7],"New York":[22.28,9.5],"North Carolina":[10.57,2.2],"North Dakota":[7.58,4.8],"Ohio":[13.22,20.1],"Oklahoma":[9.30,2.4],"Oregon":[10.29,4.0],"Pennsylvania":[13.59,14.7],"Rhode Island":[23.60,-0.3],"South Carolina":[11.68,5.6],"South Dakota":[11.34,7.0],"Tennessee":[13.27,4.0],"Texas":[8.57,0.1],"Utah":[10.32,3.9],"Vermont":[20.78,6.7],"Virginia":[10.98,17.4],"Washington":[11.65,10.6],"West Virginia":[11.68,-1.2],"Wisconsin":[13.49,5.0],"Wyoming":[9.73,1.9]};

/* Generic question screen: options -> lock -> insight card -> continue */
function question(cfg){
  setProgress(cfg.step);
  var html='<section class="screen"><p class="eyebrow">'+esc(cfg.eyebrow)+'</p><h1>'+esc(cfg.q)+'</h1>'+(cfg.sub?'<p class="sub">'+esc(cfg.sub)+'</p>':"")+
    '<div class="opts'+(cfg.grid?" grid2":"")+'">'+cfg.opts.map(function(o){return '<button class="opt" data-k="'+o[0]+'"'+(o[2]===false?" disabled":"")+'><span>'+esc(o[1])+'</span>'+(o[3]?'<span class="hint">'+esc(o[3])+'</span>':"")+'</button>';}).join("")+'</div><div class="slot"></div></section>';
  var node=$(html), opts=node.querySelector(".opts"), slot=node.querySelector(".slot");
  opts.addEventListener("click",function(e){
    var b=e.target.closest(".opt");if(!b||b.disabled||opts.classList.contains("locked"))return;
    opts.classList.add("locked");
    opts.querySelectorAll(".opt").forEach(function(x){x.classList.add(x===b?"chosen":"dim");});
    var k=b.dataset.k;cfg.pick(k);
    var res=cfg.insight(k);
    if(res&&res.redirect){setTimeout(res.redirect,350);return;}
    slot.appendChild(card(res,cfg.next));
  });
  show(node);
}

}

  setProgress(3);
  var names=Object.keys(STATES).sort();
  var n=$('<section class="screen"><p class="eyebrow">Location</p><h1>Where are most of your stores?</h1><p class="sub">Pick the state with the most locations. We pull that state’s current commercial rate and trend.</p><select class="state" id="stsel" aria-label="State"><option value="">Choose a state</option>'+names.map(function(s){return '<option>'+esc(s)+'</option>';}).join("")+'</select><div class="slot"></div></section>');
  var sel=n.querySelector("#stsel"),slot=n.querySelector(".slot");
  sel.addEventListener("change",function(){
    if(!sel.value)return;S.state=sel.value;slot.innerHTML="";
    var d=STATES[S.state],rate=d[0],chg=d[1],diff=(rate/NATIONAL-1)*100,dereg=!!DEREG[S.state];
    var h=Math.abs(diff)<3?"Commercial power in "+esc(S.state)+" runs close to the national average, and it’s still climbing.":diff>0?"Commercial power in "+esc(S.state)+" costs about "+Math.round(diff)+"% more than the national average.":"Power in "+esc(S.state)+" is cheaper than average. That makes waste easy to ignore, and it still compounds.";
    var p=(chg>=5?"Rates rose "+chg.toFixed(1)+"% in the past year alone. ":chg>0?"Rates still rose "+chg.toFixed(1)+"% in the past year. ":"Rates dipped slightly this year, but the long-run direction is up. ")+(dereg?"Your state also lets businesses shop their supply rate, so we’ll include rate negotiation.":"");
    slot.appendChild(card({tag:"Your market",h:h,p:p,
      viz:'<div class="fig"><span class="big metered" data-count="'+rate+'" data-fmt="cents">0¢</span><span class="vs">per kWh vs '+NATIONAL.toFixed(2)+'¢ national</span></div><div class="fig" style="margin-top:8px"><span class="big" style="font-size:26px" data-count="'+chg+'" data-fmt="pct">0%</span><span class="vs">change, past 12 months</span></div>',
      src:"EIA commercial retail price, 12 months to Aug 2026"},locations));
  });
  show(n);
  setTimeout(function(){sel.focus({preventScroll:true});},600);
}

function locations(){
  question({step:4,eyebrow:"Footprint",q:"How many stores?",opts:[["1","1"],["3","2 to 5"],["12","6 to 20"],["35","21 to 50"],["75","50+"]],
    pick:function(k){S.locs=parseInt(k,10);S.locLabel={"1":"1","3":"2 to 5","12":"6 to 20","35":"21 to 50","75":"50+"}[k];},
    insight:function(){return S.locs===1?{tag:"Footprint",h:"One store means one detailed picture. Everything from here gets sized to it.",p:"Single-store operators feel every change directly in monthly cash flow."}:
      {tag:"Footprint",h:"Whatever we find in one store, you have it "+S.locLabel+" times over.",p:"Grocery chains repeat the same cases, racks and rooftop units store after store, so one fix becomes a rollout."};},
    next:spend});
}

function spend(){
  question({step:5,eyebrow:"Scale",q:"Roughly what’s your total monthly energy spend, all stores combined?",
    opts:[["low","Under $20K"],["b1","$20K to $50K"],["b2","$50K to $100K"],["b3","$100K to $250K"],["b4","$250K+"],["unk","Not sure, help me estimate"]],
    pick:function(k){S.band=k;},
    insight:function(k){
      if(k==="low")return{redirect:under};
      if(k==="unk")return{redirect:sizeQ};
      S.monthly=SPEND_MID[k];S.estimated=false;return spendInsight();},
    next:cases});
}
function spendInsight(){
  var m=S.monthly;
  return{tag:"Where the bill hides",h:"At about "+kmoney(m)+" a month, demand charges alone could be "+kmoney(m*0.3)+" to "+kmoney(m*0.7)+" of it.",
    p:"Demand charges are set by your single highest 15 to 30 minutes of the month. One hot afternoon can price the whole month.",
    viz:'<div class="fig"><span class="big" data-count="'+(m*12)+'">$0</span><span class="vs">per year in energy'+(S.estimated?", estimated":"")+'</span></div>',
    src:"NREL: demand charges commonly 30 to 70% of a demand-billed commercial bill"};
}
function sizeQ(){
  question({step:5,eyebrow:"Scale",q:"How big is a typical store?",sub:"We’ll estimate your spend from grocery benchmarks and tell you we did.",
    opts:[["small","Neighborhood","under 25K sq ft"],["std","Standard","25K to 50K sq ft"],["big","Superstore","50K+ sq ft"]],
    pick:function(k){S.size=k;S.monthly=SQFT[k].sq*SQFT_RATE/12*S.locs;S.estimated=true;},
    insight:function(){if(S.monthly<20000)return{redirect:under};return spendInsight();},
    next:cases});
}

function cases(){
  question({step:6,eyebrow:"On your floor",q:"How are your refrigerated cases mostly set up?",
    opts:[["open","Mostly open cases"],["mix","A mix of open and doored"],["door","Mostly doored cases"],["unk","Not sure"]],
    pick:function(k){S.cases=k;},
    insight:function(k){
      if(k==="door")return{tag:"Case setup",h:"Doors help. The next leak is usually the compressors themselves and how hard they cycle.",p:"Doored cases cut the spill, but the racks behind them still run every hour of the year."};
      return{tag:"Case setup",h:"Open cases spill cold air into your aisles. Your HVAC then pays to reheat the store while your refrigeration pays to replace the cold.",p:k==="unk"?"Most stores have at least some open multi-deck cases. Wherever they are, you’re paying twice for the same air.":"You’re paying twice for the same air, all day."};},
    next:age});
}

function age(){
  question({step:7,eyebrow:"Equipment",q:"How old are your main refrigeration racks or compressors?",
    opts:[["u5","Under 5 years"],["5","5 to 10 years"],["10","10 to 15 years"],["15","15+ years"],["unk","Not sure"]],
    pick:function(k){S.age=k;},
    insight:function(k){
      if(k==="u5")return{tag:"Equipment",h:"Newer equipment, so the opportunity is keeping it new.",p:"Clean power and lighter duty cycles are what add 5 to 15 years to equipment life. The cheapest replacement is the one you push out a decade."};
      if(k==="unk")return{tag:"Equipment",h:"That’s normal. It’s one of the first things we check on a walkthrough.",p:"Refrigeration failure is the most common equipment breakdown claim in grocery, so age matters more here than almost anywhere."};
      return{tag:"Equipment",h:"At this age the risk isn’t just the repair bill. One rack failure can mean a case line full of lost product.",p:"Equipment past 10 years is where emergency calls and premium parts pricing start stacking up. Extending its life is the cheapest capital decision you can make."};},
    next:summer});
}

function summer(){
  question({step:8,eyebrow:"Pattern",q:"Is your summer electric bill noticeably higher than winter?",
    opts:[["much","Much higher"],["little","A little higher"],["same","About the same"],["unk","Not sure"]],
    pick:function(k){S.summer=k;},
    insight:function(k){
      if(k==="much")return{tag:"Pattern",h:"That’s the demand-charge signature.",p:"Hot afternoons push your condensers and your HVAC to peak at the same moment, and that single peak sets your demand charge for the month."};
      if(k==="little")return{tag:"Pattern",h:"Even a modest summer bump usually means peaks are stacking.",p:"Condensers work hardest on the hottest afternoons, right when your HVAC does too. Flattening that overlap lowers the demand line."};
      if(k==="same")return{tag:"Pattern",h:"A flat bill means your baseline is doing the damage.",p:"Refrigeration runs 8,760 hours a year. When the bill barely moves with the seasons, the savings are in the load that never shuts off."};
      return{tag:"Pattern",h:"Worth a look next time it crosses your desk.",p:"A summer spike is the clearest sign that demand charges are driving your bill. We’ll check twelve months of history on a walkthrough."};},
    next:hours});
}

function hours(){
  question({step:9,eyebrow:"Hours",q:"How many hours a day are your stores open?",
    opts:[["24","24 hours"],["18","18 or more"],["u18","Under 18"]],
    pick:function(k){S.hours=k;},
    insight:function(k){return k==="24"?{tag:"Hours",h:"Every system you run is on the clock every hour of the year.",p:"Round-the-clock stores wear equipment fastest, so every point of efficiency and every year of added life is worth more to you."}:
      {tag:"Hours",h:"Your compressors don’t know you’re closed.",p:"Lights and HVAC may set back overnight, but refrigeration runs all 8,760 hours of the year."};},
    next:capture});
}

function under(){
  setProgress(TOTAL,"GROCERY DIAGNOSTIC");
  var n=$('<section class="screen"><p class="eyebrow">Thanks for running it</p><h1>Our full program is built for portfolios spending $20K or more a month.</h1><p class="sub">We don’t want to waste your time with a pitch that doesn’t fit. Leave your number and we’ll reach out as we roll out options sized for you.</p><div class="field"><label for="u-name">First name</label><input id="u-name" autocomplete="given-name"></div><div class="field"><label for="u-phone">Mobile</label><input id="u-phone" type="tel" inputmode="tel" autocomplete="tel"></div><div class="err" id="u-err"></div><div class="next" style="justify-content:space-between"><button class="link" id="restart">Start over</button><button class="btn" id="u-go">Keep me posted</button></div><p class="note">Prototype: lead delivery to dan@danknowsaguy.org connects in the build phase.</p></section>');
  n.querySelector("#restart").addEventListener("click",function(){S={};intro();});
  n.querySelector("#u-go").addEventListener("click",function(){var ph=n.querySelector("#u-phone").value.replace(/\D/g,"");if(ph.length<10){n.querySelector("#u-err").textContent="Enter a 10-digit mobile number so we can reach you.";return;}n.querySelector("#u-err").textContent="";n.querySelector("#u-go").textContent="Noted";n.querySelector("#u-go").disabled=true;});
  show(n);
}

function capture(){
  setProgress(10);
  var n=$('<section class="screen"><p class="eyebrow">Almost there</p><h1>Where should we text your diagnostic?</h1><p class="sub">No email, no spam. Your report arrives by text, and your strategist is one reply away.</p><div class="field"><label for="c-name">First name</label><input id="c-name" autocomplete="given-name"></div><div class="field"><label for="c-phone">Mobile</label><input id="c-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 555-5555"></div><div class="err" id="c-err"></div><div class="next"><button class="btn" id="c-go">Show my diagnostic <span class="ar">→</span></button></div><p class="note">Prototype: text delivery and the lead email connect in the build phase.</p></section>');
  n.querySelector("#c-go").addEventListener("click",function(){
    var nm=n.querySelector("#c-name").value.trim(),ph=n.querySelector("#c-phone").value.replace(/\D/g,"");
    if(!nm){n.querySelector("#c-err").textContent="Add your first name so the report is addressed to you.";return;}
    if(ph.length<10){n.querySelector("#c-err").textContent="Enter a 10-digit mobile number.";return;}
    S.name=nm;S.phone=ph;reveal();
  });
  show(n);
  setTimeout(function(){var i=n.querySelector("#c-name");if(i)i.focus({preventScroll:true});},600);
}

/* ---------- Math ---------- */
function compute(){
  var A=S.monthly*12, dereg=!!DEREG[S.state];
  var C=M.hvacShare*M.coolShare*A;
  var floor=M.harmo*A + C*M.coolFloor + M.demRed*M.demPortion*A + M.litF*M.litMult*A + (dereg?M.negoF*A:0);
  var ceil =M.harmo*A + C*M.coolCeil  + M.demRed*M.demPortion*A + M.litC*M.litMult*A + (dereg?M.negoC*A:0);
  /* answers position the high end inside the program range */
  var w=0.35+({open:0.15,mix:0.08,unk:0.06,door:0}[S.cases]||0)+({"10":0.1,"15":0.12,"5":0.05,unk:0.04,u5:0}[S.age]||0)+({much:0.1,little:0.05,unk:0.03,same:0}[S.summer]||0)+(S.hours==="24"?0.03:0);
  w=clamp(w,0.35,0.75);
  var lo=floor, hi=floor+(ceil-floor)*w, mid=(lo+hi)/2;
  var esc_=clamp((STATES[S.state][1])/100,0.03,0.08);
  var f10=(Math.pow(1+esc_,10)-1)/esc_;
  return{A:A,lo:lo,hi:hi,mid:mid,loPct:lo/A,hiPct:hi/A,esc:esc_,ten:mid*f10,spend10:A*f10,dereg:dereg};
}

function findings(r){
  var f=[];
  if(S.cases==="open"||S.cases==="mix"||S.cases==="unk")f.push(["Your HVAC and refrigeration are fighting each other","Open cases spill cold into the aisles and the HVAC pays to reheat it."]);
  if(S.summer==="much"||S.summer==="little")f.push(["A summer peak is pricing your whole month","Condensers and HVAC peak together on hot afternoons and set the demand charge."]);
  if(S.age==="10"||S.age==="15")f.push(["Refrigeration past 10 years old","Rising failure and product-loss risk, with emergency pricing when it goes."]);
  if(S.hours!=="24")f.push(["Refrigeration never closes","Racks run all 8,760 hours a year, whatever your store hours."]);
  f.push(["Dirty power on every circuit","Case LEDs and electronics create distortion that inflates the bill and wears every motor on the roof."]);
  if(r.dereg)f.push(["Your supply rate is negotiable","Your state lets businesses shop supply without changing utilities."]);
  return f.slice(0,3);
}

function reveal(){
  setProgress(TOTAL,"YOUR DIAGNOSTIC");
  var r=compute(),fs=findings(r),locs=S.locs,multi=locs>1;
  var blocks={
    savings:'<div class="blk"><p class="eyebrow">What changes</p><h2>Beyond the bill</h2><div class="kv"><div><span>Maintenance cost</span><b>up to 40% lower</b></div><div><span>Added equipment life</span><b>5 to 15 years</b></div>'+(multi?'<div><span>Per store, midpoint</span><b>'+money(r.mid/locs)+'/yr</b></div>':"")+'</div></div>',
    findings:'<div class="blk"><p class="eyebrow">Where the money is leaking</p><h2>Top findings for your stores</h2><ol class="finds">'+fs.map(function(x,i){return '<li style="animation-delay:'+(i*120+300)+'ms"><span class="n">'+String(i+1).padStart(2,"0")+'</span><span><strong>'+esc(x[0])+'</strong>'+esc(x[1])+'</span></li>';}).join("")+'</ol></div>',
    nothing:'<div class="blk"><p class="eyebrow">If nothing changes</p><h2>The cost of waiting</h2><div class="kv"><div><span>Energy spend, next 10 years</span><b>'+kmoney(r.spend10)+'</b></div><div><span>Assumed rate increase</span><b>'+(r.esc*100).toFixed(1)+'% / yr</b></div><div><span>Savings left on the table</span><b>'+kmoney(r.ten)+'</b></div></div></div>',
    equipment:'<div class="blk"><p class="eyebrow">Equipment risk</p><h2>Protecting what keeps your floor cold</h2><p class="sub">'+(S.age==="10"||S.age==="15"?"Your racks are in the age range where breakdowns, emergency service and lost product start compounding.":"Clean power and lighter duty cycles keep refrigeration out of the emergency-call zone.")+' Commercial HVAC typically lasts 15 to 20 years; we aim to add 5 to 15 more.</p></div>'
  };
  var order={owner:["findings","nothing","savings","equipment"],fm:["equipment","findings","savings","nothing"],cfo:["nothing","findings","savings","equipment"],pm:["savings","equipment","findings","nothing"],multi:["findings","savings","nothing","equipment"]}[S.role]||["findings","nothing","savings","equipment"];
  var smsBody="Hi Dan, "+S.name+" here. I just ran the Energy Plus grocery diagnostic: "+S.locLabel+(locs===1?" store":" stores")+" in "+S.state+", about "+kmoney(S.monthly)+"/mo in energy. It estimated "+kmoney(r.lo)+" to "+kmoney(r.hi)+"/yr in savings. Let's talk.";
  var n=$('<section class="screen readout"><div class="panel"><div class="grat"></div><div class="in"><p class="eyebrow">'+esc(S.name)+' · Grocery · '+esc(S.state)+'</p><h2>Estimated annual savings'+(multi?" across your stores":"")+'</h2><div class="range"><span id="lo">$0</span> to <span id="hi">$0</span></div><div class="per">per year · '+Math.round(r.loPct*100)+' to '+Math.round(r.hiPct*100)+'% of your energy spend</div><div class="ticks"><div><b id="ten">$0</b><span>10-year savings, midpoint</span></div><div><b>'+kmoney(r.A)+'</b><span>annual energy spend'+(S.estimated?", est.":"")+'</span></div><div><b>'+(r.esc*100).toFixed(1)+'%</b><span>yearly rate climb used</span></div></div></div></div>'+
    '<div class="blocks">'+order.map(function(k){return blocks[k];}).join("")+
    '<div class="blk"><p class="eyebrow">Next step</p><h2>Find out if these numbers hold for your stores</h2><p class="sub">A 15-minute call turns this estimate into a site-specific number. Text Dan directly.</p><div class="cta" style="margin-top:16px"><a class="btn" id="sms" href="sms:'+PHONE_E164+'?body='+encodeURIComponent(smsBody)+'">Text Dan <span class="ar">→</span></a><div class="num"><span>'+PHONE_DISPLAY+'</span><button class="copy" id="cp">Copy number</button></div><a class="link" href="'+BOOK_URL+'" target="_blank" rel="noopener">Or book a call</a></div></div>'+
    '<div class="blk assume"><p class="eyebrow">Assumptions we made</p><ul>'+(S.estimated?"<li>Energy spend estimated from store size and count using grocery benchmarks.</li>":"<li>Energy spend uses the midpoint of the range you picked.</li>")+'<li>Rate and trend are the '+esc(S.state)+' commercial averages, not your utility’s exact tariff.</li><li>Savings use Energy Plus program ranges for grocery: power harmonization, cooling and refrigeration, demand, and lighting'+(r.dereg?", plus supply-rate negotiation":"")+'. Your answers set where in that range you land.</li><li>This is an estimate, verified only by a site assessment.</li></ul></div></div>');
  n.querySelector("#cp").addEventListener("click",function(e){var b=e.currentTarget;try{navigator.clipboard.writeText(PHONE_DISPLAY).then(function(){b.textContent="Copied";},function(){b.textContent=PHONE_DISPLAY;});}catch(_){b.textContent=PHONE_DISPLAY;}});
  show(n);
  setTimeout(function(){countUp(document.getElementById("lo"),r.lo,kmoney,1600);countUp(document.getElementById("hi"),r.hi,kmoney,1900);countUp(document.getElementById("ten"),r.ten,kmoney,2200);},reduce?0:420);
}

intro();
})();
</script>

</body></html>
