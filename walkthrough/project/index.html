<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Savings Plan</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#174e58">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f3f5f6; --card:#ffffff; --ink:#101416; --body:#3b4347; --faint:#6b747a; --rule:#d3d9dd;
  --petrol:#174e58; --petrol-2:#1f5c67; --on-petrol-dim:#b9d0d4; --ochre:#e0a21c; --ok:#1d7a4f; --warn:#9a5b00;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--f-display);font-size:18px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 64px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--petrol-2);outline-offset:3px}
header{background:var(--petrol);color:#fff;padding:22px 16px 26px}
header .wrap{padding-bottom:0}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand .av{width:44px;height:44px;flex:none}
.brand b{font-weight:800;font-stretch:112%;font-size:16px;color:#fff}
.brand span{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--on-petrol-dim)}
h1{font-size:clamp(28px,6vw,38px);line-height:1.1;margin:0 0 8px;font-stretch:108%;color:#fff;letter-spacing:-.01em}
header p{margin:0;color:var(--on-petrol-dim)}
.prog{margin-top:18px}
.prog .t{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-petrol-dim)}
.prog .bar{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;width:0;background:var(--ochre);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.step{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:20px 18px;margin-top:18px}
.step.done{border-color:#b8d8c7}
.sh{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--petrol);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:15px}
.done .num{background:var(--ok)}
.step h2{font-size:22px;line-height:1.25;margin:2px 0 4px;color:var(--ink)}
.tagline{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.step p{margin:8px 0}
.why{color:var(--faint);font-size:16px}
.how{margin:10px 0 0;padding-left:22px}.how li{margin:4px 0}
.btn{background:var(--ink);color:#fff;border:0;padding:14px 24px;font-weight:600;font-size:18px;cursor:pointer;border-radius:999px;display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.btn:hover{background:var(--petrol-2)}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.alt:hover{background:var(--ink);color:#fff}
.link{background:none;border:0;padding:6px 0;color:var(--petrol);text-decoration:underline;cursor:pointer;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.or{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:16px 0 4px;display:flex;align-items:center;gap:10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--rule)}
label.l{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
input.t{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--rule);border-radius:12px;background:#fff;color:var(--ink)}
.drop{display:block;border:2px dashed var(--rule);border-radius:14px;padding:18px;text-align:center;cursor:pointer;margin-top:12px;background:#fafbfb}
.drop:hover,.drop.over{border-color:var(--petrol-2);background:#eef4f5}
.drop b{display:block;color:var(--ink);font-size:18px}
.drop span{font-size:15px;color:var(--faint)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.files{list-style:none;padding:0;margin:10px 0 0;font-size:15px}
.files li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #eef1f2}
.files .s{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.s.ok{color:var(--ok)}.s.bad{color:#b3261e}.s.wait{color:var(--faint)}
.have{display:inline-flex;align-items:center;gap:8px;background:#e8f4ee;color:var(--ok);font-weight:600;border-radius:999px;padding:6px 14px;font-size:15px;margin-top:6px}
.msg{font-size:16px;margin:10px 0 0}.msg.ok{color:var(--ok)}.msg.warn{color:var(--warn)}
.tip{background:#f6f2e6;border-left:4px solid var(--ochre);border-radius:8px;padding:10px 14px;font-size:16px;margin-top:12px}
.talk{margin-top:28px;text-align:center}
.talk p{margin:0 0 10px}
.small{font-size:14px;color:var(--faint);text-align:center;margin-top:26px}
.err{background:#fff;border:1px solid var(--rule);border-radius:18px;padding:24px;margin-top:24px}
[hidden]{display:none!important}
.watt{display:block;overflow:visible}.av svg{width:100%;height:100%}
.watt .w-body{fill:#fff;stroke:#fff}.watt .w-eye{fill:var(--petrol)}.watt .w-acc{fill:var(--ochre)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><div class="av" id="av"></div><div><b>Watt</b><span>Your Energy+ AI</span></div></div>
  <h1 id="title">Your savings plan</h1>
  <p id="lead">Loading your page&hellip;</p>
  <div class="prog" id="prog" hidden><div class="t"><span id="progt">0 of 2 done</span><span>Your real numbers</span></div><div class="bar"><i id="progbar"></i></div></div>
</div></header>
<main class="wrap" id="main"></main>
<script src="../watt.js?v=202611111110"></script>
<script src="project.js?v=202611121300"></script>
</body>
</html>
