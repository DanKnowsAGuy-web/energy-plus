<script>
(async () => {

const { W, H, FPS, BEAT, GREEN, RED, NAVY, $, $$, clamp, lerp, E, prog, rng, mixRGB, mix, beatPulse, el, IC, P, pts, mkBox, quad, Building, makeLine, splitChars } = AD;
const DUR = 60;

/* ---------- Arizona dealership diorama (scene 2) ---------- */
function buildDealer(parent, ox, oy) {
  const g = el("g", { transform: `translate(${ox},${oy})` }, parent);
  // plinth
  mkBox(g, ["#DDB57C", "#B98B54", "#9A7240"], "#EBCB95", 1.5).set(-310, -240, -36, 620, 480, 36);
  // sand texture dots
  const rr = rng(11), dots = el("g", { fill: "#C9A066", opacity: .55 }, g);
  for (let i = 0; i < 70; i++) { const p = P(-300 + rr() * 600, -230 + rr() * 460, 0); el("ellipse", { cx: p[0], cy: p[1], rx: 3 + rr() * 4, ry: 1.5 + rr() * 2 }, dots); }
  // lot
  quad(g, [[-282, -30, 0], [292, -30, 0], [292, 222, 0], [-282, 222, 0]], { fill: "#4B4954" });
  quad(g, [[-282, 222, 0], [292, 222, 0], [292, 232, 0], [-282, 232, 0]], { fill: "#E9DDC8" });

  }
  // service building

  for (let i = 0; i < 2; i++) {

  }

  const sr = mkBox(g, ["#D9D1C3", "#F1EBE0", "#CFC6B7"], "#FFFFFF", 1); sr.set(-276, -222, 0, 336, 156, 108);
  quad(g, [[-262, -66, 6], [48, -66, 6], [48, -66, 84], [-262, -66, 84]], { fill: "#6CB2E8" });
  quad(g, [[-210, -66, 6], [-170, -66, 6], [-120, -66, 84], [-160, -66, 84]], { fill: "rgba(255,255,255,.35)" });
  quad(g, [[-60, -66, 6], [-40, -66, 6], [10, -66, 84], [-10, -66, 84]], { fill: "rgba(255,255,255,.3)" });
  for (let i = 0; i <= 6; i++) { const x = -262 + i * 51.6; const a = P(x, -66, 6), b = P(x, -66, 84); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "#E9EEF4", "stroke-width": 2.5 }, g); }
  quad(g, [[60, -200, 6], [60, -90, 6], [60, -90, 84], [60, -200, 84]], { fill: "#5EA2D6" });
  mkBox(g, ["#3D4453", "#2C3240", "#252A36"], "#5D677F", 1).set(-288, -70, 86, 360, 44, 9);
  // rooftop units on the showroom
  [[-250, -200], [-170, -200], [-90, -200]].forEach(([x, y]) => mkBox(g, ["#B9C0CC", "#9AA2B1", "#858D9C"], "#E3E7EE", 1).set(x, y, 108, 46, 38, 22));
  // cars, painter-sorted
  const carCols = ["#F2F3F5", "#D9483B", "#3C6FB4", "#B9C1CC", "#2A2F3A", "#F2F3F5", "#C9CED6", "#3C6FB4", "#D9483B", "#2A2F3A", "#F2F3F5", "#9AA3B0", "#D9483B", "#B9C1CC", "#2A2F3A", "#3C6FB4"];
  const cars = [];
  let ci = 0;
  for (let row = 0; row < 2; row++) for (let i = 0; i < 9; i++) {
    if ((row === 0 && (i === 3 || i === 7)) || (row === 1 && (i === 1 || i === 5))) continue;
    cars.push({ x: -258 + i * 60, y: row ? 146 : 16, c: carCols[ci++ % carCols.length] });
  }
  cars.sort((a, b) => (a.x + a.y) - (b.x + b.y)).forEach(({ x, y, c }) => {
    const cg = el("g", {}, g);
    const sh = c;
    mkBox(cg, [sh, mix(sh, "#000000", .18), mix(sh, "#000000", .32)], "rgba(0,0,0,.25)", 1).set(x + 6, y + 2, 4, 38, 56, 15);
    mkBox(cg, ["#1D2A3E", "#2E4A6B", "#22374F"], "rgba(0,0,0,.3)", 1).set(x + 10, y + 16, 19, 30, 26, 12);
  });
  // cacti
  const cact = (x, y, s = 1) => {
    const p = P(x, y, 0), cg = el("g", { transform: `translate(${p[0]},${p[1]}) scale(${s})`, stroke: "#4F8E5C", "stroke-width": 15, "stroke-linecap": "round", "stroke-linejoin": "round", fill: "none" }, g);
    el("path", { d: "M0 0V-84M0-38H-20V-62M0-50H18V-74" }, cg);
    el("path", { d: "M-3-80V-6", stroke: "#6DB07A", "stroke-width": 4 }, cg);
  };
  cact(-290, 200, 1); cact(-300, -60, .8); cact(290, -230, .9); cact(300, -100, .7);
  return g;
}

/* ---------- Build the scenes ---------- */
const S1 = $("#s1"), S2A = $("#s2a"), S2B = $("#s2b"), S4 = $("#s4"), S5 = $("#s5"), S6 = $("#s6");
const b1 = new Building($("#s1svg"), 540, 1085);

// scene 1 type
const L_your = makeLine(S1, "YOUR BILL", 150, 190);

const L_8v = makeLine(S1, '<span class="r">8</span> VENDORS.', 170, 170);

// vendor cards
const VENDORS = [
  ["SOLAR", 205, 730, -8], ["BATTERY", 875, 700, 7], ["HVAC", 150, 1010, 5], ["CONTROLS", 930, 985, -6],
  ["FINANCE", 215, 1300, -4], ["REBATES", 870, 1320, 8], ["INSTALLER", 380, 1520, 6], ["TAX", 735, 1545, -7]
];

const vcards = VENDORS.map(([name, x, y, rot]) => {

  c.className = "vcard";
  c.innerHTML = `<div class="in"><b></b><span>${name}</span></div>`;
  vbox.appendChild(c);
  return { el: c, inner: c.firstChild, x, y, rot, name };
});

// scene 2a type
const L_we = makeLine(S2A, "WE HANDLE", 740, 190);
const L_all = makeLine(S2A, "ALL OF IT.", 920, 190, { cls: "g" });
const chWe = splitChars(L_we), chAll = splitChars(L_all);

// scene 2b
const s2svg = $("#s2svg");
el("circle", { cx: 540, cy: 1010, r: 470, fill: "url(#sun)", id: "sunDisc" }, s2svg);
el("path", { d: "M0 1180 L130 1080 L230 1130 L360 1010 L470 1100 L560 1040 L700 1120 L820 1020 L960 1110 L1080 1060 V1400 H0Z", fill: "#241F48", opacity: .9 }, s2svg);
el("path", { d: "M0 1220 L170 1140 L300 1190 L430 1120 L600 1190 L760 1130 L900 1180 L1080 1130 V1400 H0Z", fill: "#2E2552" }, s2svg);
const dealerG = buildDealer(s2svg, 540, 1290);
const L_49 = makeLine(S2B, "49%", 190, 330, { cls: "g", id: "n49" });
L_49.style.lineHeight = "1";
const L_lower = makeLine(S2B, "LOWER BILL", 530, 120);
const underline = document.createElement("div");
Object.assign(underline.style, { position: "absolute", left: "300px", width: "480px", top: "650px", height: "10px", borderRadius: "5px", background: GREEN, boxShadow: "0 0 24px rgba(61,255,138,.8)", transformOrigin: "0 50%", visibility: "hidden" });
S2B.appendChild(underline);
const disc = document.createElement("div");
disc.className = "small"; disc.style.top = "1720px"; disc.style.fontSize = "34px"; disc.style.color = "rgba(255,255,255,.78)";
disc.textContent = "Arizona Ford dealership. Client-reported. Results vary.";
S2B.appendChild(disc);

// scene 3: numerals
function numeral(svg, n) {
  const t = el("text", { x: 70, y: 470, "font-size": 430, "font-weight": 900, fill: GREEN, "fill-opacity": 0, stroke: GREEN, "stroke-width": 7, "stroke-linejoin": "round", "stroke-dasharray": 2600, "stroke-dashoffset": 2600, "letter-spacing": "-20" }, svg);
  t.textContent = n;
  t.style.filter = "drop-shadow(0 0 22px rgba(61,255,138,.55))";
  return t;
}
const st1svg = $("#st1svg"), st2svg = $("#st2svg"), st3svg = $("#st3svg");
const N1 = numeral(st1svg, "1"), N2 = numeral(st2svg, "2"), N3 = numeral(st3svg, "3");

// step 1: big rooftop unit + meter + before/after graphs
const bigUWrap = el("g", { transform: "translate(770,400)" }, st1svg);
const bigU = el("g", {}, bigUWrap);
el("polygon", { points: pts([[-110, -80, 0], [150, -80, 0], [150, 130, 0], [-110, 130, 0]]), fill: "rgba(0,0,0,.45)", filter: "url(#soft)" }, bigU);
mkBox(bigU, ["#2E4D80", "#203D69", "#183157"], "#6286C4", 2).set(-120, -90, 0, 240, 180, 140);
for (let i = 1; i < 7; i++) { const z = 18 + i * 15; const a = P(-104, 90, z), b = P(104, 90, z); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "#33598F", "stroke-width": 3 }, bigU); }
for (let i = 1; i < 7; i++) { const z = 18 + i * 15; const a = P(120, -76, z), b = P(120, 76, z); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "#2A4C7E", "stroke-width": 3 }, bigU); }
const bigFans = [[-55, 0], [55, 0]].map(([x, y]) => {
  const c = P(x, y, 140);
  el("ellipse", { cx: c[0], cy: c[1], rx: 46 * 1.2247, ry: 46 * 0.7071, fill: "#0B1A33", stroke: "#6286C4", "stroke-width": 2.5 }, bigU);
  return { x, y, c, p: el("path", { stroke: "#9FBDF0", "stroke-width": 5, "stroke-linecap": "round", fill: "none" }, bigU) };
});
// meter clipped onto the front face
const fm = P(-70, 90, 120);
const { meter, rings: meterRings } = AD.makeMeter(st1svg, 770 + fm[0], 400 + fm[1]);

function dayPath(x, y, w, h, seed, peakLo, peakHi, spike) {
  const r = rng(seed), N = 7 * 22;
  let d = "";
  for (let i = 0; i <= N; i++) {
    const u = i / N, day = Math.floor(u * 7 - 1e-9), f = u * 7 - day;
    const peak = lerp(peakLo, peakHi, (Math.sin(day * 2.1 + seed) + 1) / 2);
    let v = 0.1 + peak * Math.pow(Math.sin(Math.PI * f), 2.2);
    if (spike && f > 0.42 && f < 0.56) v += spike * Math.sin(Math.PI * (f - 0.42) / 0.14) * (0.6 + 0.4 * r());
    v += (r() - 0.5) * 0.03;
    d += (i ? "L" : "M") + (x + u * w).toFixed(1) + "," + (y + h - v * h).toFixed(1);
  }
  return d;
}
function graphPanel(svg, x, y, label, color, path) {
  const g = el("g", {}, svg);
  el("rect", { x, y, width: 460, height: 430, rx: 30, fill: "rgba(16,36,70,.75)", stroke: "#2A4A7E", "stroke-width": 2.5 }, g);
  const lab = el("text", { x: x + 34, y: y + 72, "font-size": 48, "font-weight": 900, fill: color, "letter-spacing": "-1" }, g); lab.textContent = label;
  el("rect", { x: x + 284, y: y + 34, width: 146, height: 52, rx: 26, fill: "none", stroke: "rgba(255,255,255,.55)", "stroke-width": 2.5 }, g);
  const tg = el("text", { x: x + 357, y: y + 70, "font-size": 28, "font-weight": 700, fill: "#fff", "text-anchor": "middle", "letter-spacing": "1" }, g); tg.textContent = "7 DAYS";
  for (let i = 1; i < 7; i++) el("line", { x1: x + 30 + i * 400 / 7, y1: y + 120, x2: x + 30 + i * 400 / 7, y2: y + 400, stroke: "rgba(255,255,255,.07)", "stroke-width": 2 }, g);
  el("line", { x1: x + 30, y1: y + 400, x2: x + 430, y2: y + 400, stroke: "rgba(255,255,255,.25)", "stroke-width": 2 }, g);
  const glow = el("path", { d: path, fill: "none", stroke: color, "stroke-width": 14, "stroke-linejoin": "round", opacity: .35, filter: "url(#soft)" }, g);
  const ln = el("path", { d: path, fill: "none", stroke: color, "stroke-width": 6, "stroke-linejoin": "round", "stroke-linecap": "round" }, g);
  return { g, ln, glow, len: 0 };
}
const gB = graphPanel(st1svg, 60, 640, "BEFORE", RED, dayPath(90, 760, 400, 280, 3, 0.62, 0.8, 0.12));
const gA = graphPanel(st1svg, 560, 640, "AFTER", GREEN, dayPath(590, 760, 400, 280, 3, 0.3, 0.42, 0));
const L_prove = makeLine($("#st1"), "PROVE IT", 1170, 190);
const L_meter = makeLine($("#st1"), "ON YOUR METER.", 1345, 190, { cls: "g" });

// step 2: icon grid
const grid = Object.keys(AD.ICONS).map((name, i) => AD.checkCard(st2svg, name, i % 2 ? 790 : 290, i < 2 ? 700 : 1020));
const L_weh = makeLine($("#st2"), "WE HANDLE", 1250, 190);
const L_every = makeLine($("#st2"), "EVERYTHING.", 1425, 190, { cls: "g" });

// step 3: cash flow chart
const cfx = 60, cfy = 560, cfw = 960, cfh = 580, base = cfy + 470;
el("rect", { x: cfx, y: cfy, width: cfw, height: cfh, rx: 34, fill: "rgba(16,36,70,.75)", stroke: "#2A4A7E", "stroke-width": 2.5 }, st3svg);
for (let i = 1; i < 6; i++) el("line", { x1: cfx + i * cfw / 6, y1: cfy + 40, x2: cfx + i * cfw / 6, y2: cfy + cfh - 40, stroke: "rgba(255,255,255,.06)", "stroke-width": 2 }, st3svg);
el("line", { x1: cfx + 40, y1: base, x2: cfx + cfw - 40, y2: base, stroke: "rgba(255,255,255,.45)", "stroke-width": 3, "stroke-dasharray": "14 12" }, st3svg);
const be = el("text", { x: cfx + cfw - 44, y: base + 50, "font-size": 30, "font-weight": 700, fill: "rgba(255,255,255,.6)", "text-anchor": "end", "letter-spacing": "2" }, st3svg); be.textContent = "BREAK-EVEN";
let cfD = "", cfPts = [];
for (let i = 0; i <= 120; i++) {
  const u = i / 120, x = cfx + 70 + u * (cfw - 150);
  const y = base - 46 - Math.pow(u, 1.45) * 360 - Math.sin(u * 19) * 9 * (1 - u * 0.6);
  cfPts.push([x, y]); cfD += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
}
const cfClip = el("clipPath", { id: "cfClip" }, st3svg);
const cfClipRect = el("rect", { x: cfx, y: cfy, width: 0, height: cfh }, cfClip);
el("path", { d: cfD + `L${cfPts[cfPts.length - 1][0]},${base}L${cfPts[0][0]},${base}Z`, fill: "url(#gArea)", "clip-path": "url(#cfClip)" }, st3svg);
const cfGlow = el("path", { d: cfD, fill: "none", stroke: GREEN, "stroke-width": 26, opacity: .4, filter: "url(#soft)", "stroke-linecap": "round" }, st3svg);
const cfLine = el("path", { d: cfD, fill: "none", stroke: GREEN, "stroke-width": 8, "stroke-linecap": "round", "stroke-linejoin": "round" }, st3svg);
const cfStart = el("circle", { cx: cfPts[0][0], cy: cfPts[0][1], r: 12, fill: "#fff", stroke: GREEN, "stroke-width": 5, opacity: 0 }, st3svg);
const cfHead = el("circle", { r: 15, fill: "#E9FFF1", opacity: 0 }, st3svg);
cfHead.style.filter = "drop-shadow(0 0 18px #3DFF8A) drop-shadow(0 0 40px #3DFF8A)";
const L_path = makeLine($("#st3"), "A PATH TO", 1215, 150);
const L_cash = makeLine($("#st3"), "CASH FLOW", 1365, 190, { cls: "g" });
const L_day = makeLine($("#st3"), "DAY ONE.", 1540, 190);

      const crumple = Math.sin(prog(t, 2.0, 2.9) * Math.PI);
      const W0 = 760, H0 = 980, { x0, y0, w, d } = b1;
      const corner = P(x0, y0, 0);
      const fa = [IC * w / W0, 0.5 * w / W0, -IC * d / H0, 0.5 * d / H0, b1.ox + corner[0] - 160, b1.oy + corner[1] - 470];
      // start: rotated -3deg around center
      const c3 = Math.cos(-3 * Math.PI / 180), s3 = Math.sin(-3 * Math.PI / 180);
      const sa = [c3, s3, -s3, c3, 540 - (c3 * 380 - s3 * 490) - 160, 960 - (s3 * 380 + c3 * 490) - 470];
      const M = sa.map((v, i) => lerp(v, fa[i], m));
      M[0] *= 1 - 0.1 * crumple; M[3] *= 1 - 0.18 * crumple; M[2] += 0.18 * crumple * Math.sin(t * 40);
      if (t >= 2.0) { bill1.style.transformOrigin = "0 0"; bill1.style.transform = `matrix(${M.map(v => v.toFixed(4)).join(",")})`; bill1.style.filter = `brightness(${(1 - 0.55 * m).toFixed(3)})`; }
      bill1.style.opacity = t < 2.0 ? 1 : (1 - prog(t, 2.75, 3.05)).toFixed(3);
      bill1.style.visibility = t > 3.1 ? "hidden" : "visible";
    }
    const h = b1.H * prog(t, 2.72, 3.25, "back.out(1.4)");
    const heat = prog(t, 3.2, 4.2);
    const waste = prog(t, 4.0, 5.0);
    b1.g.style.visibility = t < 2.7 ? "hidden" : "visible";
    b1.grid.setAttribute("opacity", prog(t, 2.5, 3.2) * 0.9);
    b1.update(t, { h, heat, waste, fan: 1 });
    // glitch on CLIMBING.
    const gl = t > 4.4 && t < 4.62 ? 1 : t > 5.1 && t < 5.22 ? 1 : 0;
    L_climb.style.textShadow = gl ? `${(8 * Math.sin(t * 90)).toFixed(1)}px 0 rgba(0,255,255,.8), ${(-8 * Math.sin(t * 90)).toFixed(1)}px 0 rgba(255,0,80,.8)` : "";
    // cards jitter as the pile-up grows
    const j = prog(t, 10.6, 12.0) * (t < 15 ? 1 : 0), jr = 1 - 0.65 * prog(t, 13.5, 13.8);
    vcards.forEach((c, i) => {
      const a = j * jr * 7;
      c.inner.style.transform = a > 0.01 ? `translate(${(a * Math.sin(t * 47 + i * 3)).toFixed(1)}px,${(a * Math.cos(t * 53 + i * 5)).toFixed(1)}px) rotate(${(a * 0.4 * Math.sin(t * 31 + i)).toFixed(2)}deg)` : "";
    });
  }

  // ---- scene 2a ----
  if (t > 15 && t < 18.2) {
    const o = $("#orb");
    o.style.filter = `brightness(${(1 + 0.25 * beatPulse(t, 0.25)).toFixed(3)})`;
  }

  // ---- scene 2b ----
  if (t > 17.9 && t < 29.5) {
    const k = prog(t, 19.0, 21.6, "power3.out");
    L_49.firstChild.textContent = Math.round(49 * k) + "%";
    bill2bar.style.transform = `scaleX(${(1 - 0.49 * k).toFixed(4)})`;
    bill2bar.style.background = mix(RED, GREEN, prog(t, 20.6, 21.8));
    dealerG.setAttribute("transform", `translate(540,${(1290 + Math.sin(t * 1.1) * 7).toFixed(2)})`);
    $("#sunDisc").setAttribute("r", (470 + 18 * Math.sin(t * 0.9)).toFixed(1));
    $("#bill2").style.translate = `0 ${(Math.sin(t * 1.4) * 8).toFixed(2)}px`;
  }

  // ---- scene 3 ----
  if (t > 29.8 && t < 45.2) {
    // fans
    bigFans.forEach((f, i) => {
      const ang = t * 7 + i;
      let d = "";
      for (let b = 0; b < 4; b++) { const a = ang + b * 1.5708; const q = P(f.x + Math.cos(a) * 40, f.y + Math.sin(a) * 40, 140); d += `M${f.c[0].toFixed(1)},${f.c[1].toFixed(1)}L${q[0].toFixed(1)},${q[1].toFixed(1)}`; }
      f.p.setAttribute("d", d);
    });
    // icon cards snap in, checks pop
    grid.forEach((c, i) => {
      const a = 35.55 + i * 0.12, p = prog(t, a, a + 0.4, "back.out(1.8)");
      c.inner.setAttribute("transform", `rotate(${((i % 2 ? 10 : -10) * (1 - p)).toFixed(2)}) scale(${(0.5 + 0.5 * p).toFixed(4)})`);
      c.inner.setAttribute("opacity", prog(t, a, a + 0.2).toFixed(3));
      const k = t - (36.5 + i * 0.5), pop = k > 0 && k < 0.18 ? 1 + 0.35 * Math.sin(Math.PI * k / 0.18) : 1;
      c.chk.setAttribute("transform", `translate(160,-82) scale(${pop.toFixed(3)})`);
    });
    // meter pings
    meterRings.forEach((r, i) => {
      const a = t - 31.15 - i * 0.33; const ph = a < 0 ? -1 : (a % 1.0);
      if (a < 0 || t > 35) { r.setAttribute("opacity", 0); return; }
      r.setAttribute("r", (10 + ph * 110).toFixed(1)); r.setAttribute("opacity", (0.9 * (1 - ph)).toFixed(3));
    });
    // graph lines draw themselves
    [[gB, 31.45, 32.8], [gA, 31.75, 33.1]].forEach(([g, a, b]) => {
      if (!g.len) g.len = g.ln.getTotalLength();
      const off = (g.len * (1 - prog(t, a, b, "power2.inOut"))).toFixed(1);
      [g.ln, g.glow].forEach(p => { p.setAttribute("stroke-dasharray", g.len.toFixed(1)); p.setAttribute("stroke-dashoffset", off); });
    });
    // cash flow line climbs
    if (!cfLine._len) cfLine._len = cfLine.getTotalLength();
    const L = cfLine._len, k = prog(t, 40.8, 43.4, "power2.inOut");
    [cfLine, cfGlow].forEach(p => { p.setAttribute("stroke-dasharray", L.toFixed(1)); p.setAttribute("stroke-dashoffset", (L * (1 - k)).toFixed(1)); });
    const hp = cfLine.getPointAtLength(L * k);
    cfHead.setAttribute("cx", hp.x.toFixed(1)); cfHead.setAttribute("cy", hp.y.toFixed(1));
    cfHead.setAttribute("opacity", t > 40.75 ? (0.85 + 0.15 * beatPulse(t)).toFixed(3) : 0);
    cfHead.setAttribute("r", (13 + 5 * beatPulse(t)).toFixed(1));
    cfStart.setAttribute("opacity", prog(t, 40.6, 40.8));
    cfClipRect.setAttribute("width", Math.max(0, hp.x - cfx).toFixed(1));
  }

  // ---- scene 4 ----
  if (t > 44.8 && t < 50.2) {
    const sweep = prog(t, 45.65, 46.8, "power1.inOut");
    const heat = 1 - prog(t, 45.9, 47.1);
    b4.grid.setAttribute("opacity", 0.9);
    b4.update(t, { h: b4.H, heat, waste: 1, fan: heat, sweep });
    const n = t < 46.1 ? 3 : t < 46.7 ? 2 : 1;
    dollars3.textContent = "$".repeat(n);
    const gk = prog(t, 46.6, 47.0);
    dollars3.parentNode.style.color = mix(RED, GREEN, gk);
    dollars3.style.color = mix(RED, "#17B85A", gk);
    arrow3.style.color = mix(RED, "#17B85A", gk);
    arrow3.style.opacity = prog(t, 45.9, 46.2);
    arrow3.style.transform = `translateY(${(8 * Math.sin(t * 12)).toFixed(1)}px)`;
    // signature
    if (!sig._len) sig._len = sig.getTotalLength();
    const L = sig._len, k = prog(t, 47.55, 49.35, "sine.inOut");
    [sig, sigGlow].forEach(p => { p.setAttribute("stroke-dasharray", L.toFixed(1)); p.setAttribute("stroke-dashoffset", (L * (1 - k)).toFixed(1)); });
    const pp = sig.getPointAtLength(L * k);
    pen.setAttribute("transform", `translate(${pp.x.toFixed(1)},${pp.y.toFixed(1)})`);
    pen.setAttribute("opacity", (prog(t, 47.4, 47.55) * (1 - prog(t, 49.4, 49.6))).toFixed(3));
  }

  // ---- end card breathing glow ----
  if (t > 55) {
    const g = 0.5 + 0.5 * Math.exp(-Math.max(0, t - 58) * 2.2) * (t > 58 ? 1 : 0);
    L_url.style.textShadow = `0 0 ${(30 + 40 * g).toFixed(0)}px rgba(61,255,138,${(0.45 + 0.4 * g).toFixed(2)})`;
  }

  if (!shardsReady && t > 28) { buildShards(); shardsReady = true; }
  drawFX(t);
  drawGrain(t);
}

buildShards(); shardsReady = true;
AD.boot({ frame, DUR, audioSrc: "ad-audio.m4a" });
})();
</script>
