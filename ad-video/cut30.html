<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stop Overpaying For Energy</title>
<link rel="stylesheet" href="common.css">
<style>
#bill{left:300px;top:250px;width:480px;height:230px;padding:30px 40px}
#bill .hd{font-size:32px}
#bill .tot{font-size:120px;height:140px;margin-top:10px}
.src{top:1540px;font-size:30px;color:rgba(255,255,255,.62)}
.fine{top:1712px;font-size:26px;line-height:1.35;color:rgba(255,255,255,.55)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="bg"></div>
  <div id="cam">
    <!-- 0-5s: headline, then the outcome -->
    <section class="scene" id="sH"><svg class="layer" id="sHsvg"></svg></section>
    <!-- 5-11.5s: what they overpay, proven on their meter -->
    <section class="scene" id="sB"><svg class="layer" id="sBsvg"></svg></section>
    <!-- 11.5-17s: one team, one contract, no capital for the fix -->
    <section class="scene" id="sT"><svg class="layer" id="sTsvg"></svg></section>
    <!-- 17-23.5s: the overpay dissolves, nothing on your plate -->
    <section class="scene" id="sR">
      <svg class="layer" id="sRsvg"></svg>
      <div class="bill" id="bill"><div class="hd"><span>ENERGY BILL</span><svg width="32" height="42" viewBox="0 0 44 56"><path d="M26 2 4 32h16l-4 22 24-32H24z" fill="#0A1A33"/></svg></div>
        <div class="tot"><span id="dollars">$$$</span><svg id="arrow" width="70" height="88" viewBox="0 0 120 150"><path d="M60 144 112 72H80V6H40v66H8z" fill="currentColor"/></svg></div></div>
    </section>
    <!-- 23.5-30s: end card -->
    <section class="scene" id="sE"><svg class="layer" id="sEsvg"></svg></section>
    <canvas id="fx" width="1080" height="1920"></canvas>
  </div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="vig"></div>
</div></div>
<div id="hud"></div>

<script src="../assets/vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
(async () => {
"use strict";
await AD.fontsReady();
AD.injectDefs();
const { W, H, GREEN, RED, $, clamp, lerp, E, prog, rng, mixRGB, mix, beatPulse, el, P, Building, makeLine } = AD;
const DUR = 30;

/* ---------- Cash-flow chart: line climbs from just above break-even ---------- */
function cashChart(svg, x, y, w, h) {
  const g = el("g", {}, svg), base = y + h - 90;
  el("rect", { x, y, width: w, height: h, rx: 34, fill: "rgba(16,36,70,.75)", stroke: "#2A4A7E", "stroke-width": 2.5 }, g);
  for (let i = 1; i < 6; i++) el("line", { x1: x + i * w / 6, y1: y + 40, x2: x + i * w / 6, y2: y + h - 40, stroke: "rgba(255,255,255,.06)", "stroke-width": 2 }, g);
  el("line", { x1: x + 40, y1: base, x2: x + w - 40, y2: base, stroke: "rgba(255,255,255,.45)", "stroke-width": 3, "stroke-dasharray": "14 12" }, g);
  const be = el("text", { x: x + w - 44, y: base + 50, "font-size": 30, "font-weight": 700, fill: "rgba(255,255,255,.6)", "text-anchor": "end", "letter-spacing": "2" }, g);
  be.textContent = "BREAK-EVEN";
  const pts = [];
  let d = "";
  for (let i = 0; i <= 120; i++) {
    const u = i / 120, px = x + 70 + u * (w - 150);
    const py = base - 40 - Math.pow(u, 1.45) * (h - 200) - Math.sin(u * 19) * 8 * (1 - u * 0.6);
    pts.push([px, py]); d += (i ? "L" : "M") + px.toFixed(1) + "," + py.toFixed(1);
  }
  const id = "cc" + Math.round(x + y);
  const clip = el("clipPath", { id }, g);
  const clipRect = el("rect", { x, y, width: 0, height: h }, clip);
  el("path", { d: d + `L${pts[pts.length - 1][0]},${base}L${pts[0][0]},${base}Z`, fill: "url(#gArea)", "clip-path": `url(#${id})` }, g);
  const glow = el("path", { d, fill: "none", stroke: GREEN, "stroke-width": 26, opacity: .4, filter: "url(#soft)", "stroke-linecap": "round" }, g);
  const line = el("path", { d, fill: "none", stroke: GREEN, "stroke-width": 8, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
  const start = el("circle", { cx: pts[0][0], cy: pts[0][1], r: 12, fill: "#fff", stroke: GREEN, "stroke-width": 5, opacity: 0 }, g);
  const head = el("circle", { r: 15, fill: "#E9FFF1", opacity: 0 }, g);
  head.style.filter = "drop-shadow(0 0 18px #3DFF8A) drop-shadow(0 0 40px #3DFF8A)";
  let len = 0;
  return {
    g,
    update(t, a, b) {
      if (!len) len = line.getTotalLength();
      const k = prog(t, a, b, "power2.inOut");
      [line, glow].forEach(p => { p.setAttribute("stroke-dasharray", len.toFixed(1)); p.setAttribute("stroke-dashoffset", (len * (1 - k)).toFixed(1)); });
      const hp = line.getPointAtLength(len * k);
      head.setAttribute("cx", hp.x.toFixed(1)); head.setAttribute("cy", hp.y.toFixed(1));
      head.setAttribute("opacity", t > a - 0.05 ? (0.85 + 0.15 * beatPulse(t)).toFixed(3) : 0);
      head.setAttribute("r", (13 + 5 * beatPulse(t)).toFixed(1));
      start.setAttribute("opacity", prog(t, a - 0.2, a));
      clipRect.setAttribute("width", Math.max(0, hp.x - x).toFixed(1));
    }
  };
}

/* ---------- Build the scenes ---------- */
const SH = $("#sH"), SB = $("#sB"), ST = $("#sT"), SR = $("#sR"), SE = $("#sE");

// headline
const L_stop = makeLine(SH, "STOP", 500, 420, { cls: "r", maxW: 900 });
const L_over = makeLine(SH, "OVERPAYING", 900, 230);
const L_for = makeLine(SH, "FOR ENERGY.", 1100, 230);
// outcome
const L_lower = makeLine(SH, "LOWER BILL.", 230, 170, { cls: "g" });
const L_cash = makeLine(SH, "CASH FLOW", 410, 200);
const L_day = makeLine(SH, "DAY ONE.", 600, 200);
const chartH = cashChart($("#sHsvg"), 60, 880, 960, 600);

// overpay on the building
const bB = new Building($("#sBsvg"), 540, 1260);
const L_30 = makeLine(SB, "~30%", 140, 330, { cls: "r" });
L_30.style.lineHeight = "1";
const L_paid = makeLine(SB, "PAID FOR,", 500, 160);
const L_notn = makeLine(SB, "NOT NEEDED.", 660, 160, { cls: "r" });
const src = document.createElement("div");
src.className = "small src";
src.textContent = "Source: U.S. EPA estimate for the average commercial building.";
SB.appendChild(src);
const fm = P(-100, 130, 95);
const { meter, rings: meterRings } = AD.makeMeter($("#sBsvg"), 540 + fm[0], 1260 + fm[1]);
const L_prove = makeLine(SB, "PROVEN ON", 250, 190);
const L_meter = makeLine(SB, "YOUR METER.", 430, 190, { cls: "g" });

// one team
const L_one = makeLine(ST, "ONE TEAM.", 170, 190);
const L_con = makeLine(ST, "ONE CONTRACT.", 350, 190, { cls: "g" });
const L_noc = makeLine(ST, "NO CAPITAL", 170, 190);
const L_fix = makeLine(ST, "FOR THE FIX.", 350, 190, { cls: "g" });
const grid = Object.keys(AD.ICONS).map((name, i) => AD.checkCard($("#sTsvg"), name, i % 2 ? 790 : 290, i < 2 ? 830 : 1150));

// resolution
const bR = new Building($("#sRsvg"), 540, 1110);
const L_noth = makeLine(SR, "NOTHING ON", 1420, 170);
const L_plate = makeLine(SR, 'YOUR <span id="plateW">PLATE.</span>', 1590, 170);
const plateW = $("#plateW"); plateW.style.display = "inline-block";

// end card
const L_start = makeLine(SE, "START", 560, 360, { maxW: 900 });
const L_exam = makeLine(SE, "THE EXAM", 860, 360, { maxW: 900 });
const L_url = makeLine(SE, "slashyourenergycost.com", 1110, 74, { cls: "g", maxW: 900 });
L_url.style.textTransform = "none"; L_url.style.letterSpacing = "-.01em"; L_url.style.fontWeight = 700;
const L_dan = makeLine(SE, "Dan Knows A Guy", 1590, 44);
L_dan.style.textTransform = "none"; L_dan.style.letterSpacing = "0"; L_dan.style.fontWeight = 600; L_dan.style.color = "rgba(255,255,255,.72)";
const endRule = el("line", { x1: 340, y1: 1240, x2: 740, y2: 1240, stroke: GREEN, "stroke-width": 6, "stroke-linecap": "round", "stroke-dasharray": 400, "stroke-dashoffset": 400 }, $("#sEsvg"));
endRule.style.filter = "drop-shadow(0 0 12px rgba(61,255,138,.9))";
const fine = document.createElement("div");
fine.className = "small fine";
fine.textContent = "Results vary. Cash flow from day one depends on financing, utility rates and incentives. A diagnostic fee may apply.";
SE.appendChild(fine);

/* ---------- Timeline ---------- */
const tl = gsap.timeline({ paused: true });
const set = (e, v, t) => tl.set(e, v, t);
const show = (e, t) => tl.set(e, { autoAlpha: 1 }, t);
const hide = (e, t) => tl.set(e, { autoAlpha: 0 }, t);
function slam(e, t, o = {}) {
  tl.fromTo(e, { autoAlpha: o.a0 ?? 0, scale: o.from ?? 1.9, x: o.x ?? 0, y: o.y ?? 0, filter: `blur(${o.b0 ?? 20}px)` },
    { autoAlpha: 1, scale: 1, x: 0, y: 0, filter: "blur(0px)", duration: o.d ?? 0.24, ease: o.ease ?? "expo.out", immediateRender: false }, t);
}
function out(e, t, o = {}) {
  tl.to(e, { autoAlpha: 0, x: o.x ?? 0, y: o.y ?? -90, scale: o.s ?? 1, filter: `blur(${o.b ?? 16}px)`, duration: o.d ?? 0.24, ease: o.ease ?? "power2.in" }, t);
}

// 0-5: headline (first frame already shows STOP), then the outcome
show(SH, 0);
slam(L_stop, 0, { a0: 1, from: 1.45, b0: 5, d: 0.22 });
slam(L_over, 0.5); slam(L_for, 1.0);
out([L_stop, L_over, L_for], 1.8, { y: -200, d: 0.26 });
slam(L_lower, 2.1, { from: 2.2 }); slam(L_cash, 2.7); slam(L_day, 3.2, { from: 2.3 });
tl.fromTo(chartH.g, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 2.0);
tl.to(SH, { y: -320, autoAlpha: 0, filter: "blur(14px)", duration: 0.3, ease: "power3.in" }, 4.68);

// 5-11.5: ~30% paid for, not needed; proven on your meter
show(SB, 4.95);
slam(L_30, 5.5, { from: 1.6, d: 0.3 });
slam(L_paid, 7.0); slam(L_notn, 7.4, { from: 2.3 });
tl.fromTo(src, { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 7.6);
out([L_30, L_paid, L_notn, src], 8.9, { y: -70, d: 0.22 });
tl.fromTo(meter, { opacity: 0, y: -340 }, { opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.6)" }, 9.0);
slam(L_prove, 9.6); slam(L_meter, 10.1);
tl.to(SB, { y: -1920, duration: 0.4, ease: "power3.in" }, 11.15);
hide(SB, 11.6);

// 11.5-17: one team, one contract; no capital for the fix
show(ST, 11.3);
tl.fromTo(ST, { y: 1920 }, { y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 11.3);
slam(L_one, 11.6, { from: 2.2 }); slam(L_con, 12.0);
out([L_one, L_con], 14.55, { y: -70, d: 0.22 });
slam(L_noc, 15.0, { from: 2.4 }); slam(L_fix, 15.5, { from: 2.4 });
tl.to(ST, { scale: 0.55, autoAlpha: 0, filter: "blur(14px)", duration: 0.35, ease: "power3.in", transformOrigin: "540px 960px" }, 16.65);

// 17-23.5: the overpay dissolves into green
show(SR, 16.95);
tl.fromTo(SR, { scale: 1.5, filter: "blur(16px)" }, { scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false, transformOrigin: "540px 960px" }, 16.95);
tl.fromTo("#bill", { autoAlpha: 0, y: -40 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 17.15);
slam(L_noth, 19.5, { from: 1.8 }); slam(L_plate, 20.0, { from: 1.8 });
tl.to(plateW, { color: GREEN, textShadow: "0 0 34px rgba(61,255,138,.6)", duration: 0.12 }, 21.0);
tl.fromTo(plateW, { scale: 1 }, { scale: 1.12, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, 21.0);
tl.to(SR, { y: 700, autoAlpha: 0, filter: "blur(16px)", duration: 0.35, ease: "power3.in" }, 23.15);

// 23.5-30: end card
show(SE, 23.45);
slam(L_start, 23.5, { from: 2.2 });
slam(L_exam, 24.0, { from: 2.2 });
tl.fromTo(L_url, { autoAlpha: 0, y: 40, clipPath: "inset(0 100% 0 0)" }, { autoAlpha: 1, y: 0, clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "expo.out", immediateRender: false }, 24.5);
tl.to(endRule, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "expo.out" }, 24.75);
tl.fromTo(L_dan, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 25.2);
tl.fromTo(fine, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 25.4);
tl.fromTo([L_start, L_exam], { scale: 1 }, { scale: 1.045, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 28.0);
tl.to({}, { duration: 0.01 }, DUR);

/* ---------- Particles ---------- */
const fx = $("#fx"), ctx = fx.getContext("2d");
const rA = rng(99);
const motes = [...Array(70)].map(() => ({ x: rA() * W, y: rA() * H, z: 0.3 + rA() * 0.7, s: 1 + rA() * 2.2, ph: rA() * 6.28, sp: 6 + rA() * 18 }));
const DISSOLVE = 17.6;
const rD = rng(77);
const dust = [...Array(1100)].map(() => {
  const [x, y] = bR.sampleHull(rD);
  const sweepAt = clamp((y - 730) / 560);
  return { x, y, t0: DISSOLVE + 0.05 + sweepAt * 0.75 + rD() * 0.2, vx: (rD() - .5) * 70, vy: -(30 + rD() * 90), life: 1.6 + rD() * 2.2, s: 1.4 + rD() * 2.8, ph: rD() * 6.28 };
});
function drawFX(t) {
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";
  const mg = t > DISSOLVE + 0.2 ? GREEN : "#9CC0FF";
  for (const m of motes) {
    const y = ((m.y - t * m.sp * m.z) % H + H) % H, x = m.x + Math.sin(t * 0.4 + m.ph) * 20 * m.z;
    ctx.globalAlpha = 0.12 + 0.18 * m.z;
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(x, y, m.s * m.z, 0, 6.283); ctx.fill();
  }
  if (t > DISSOLVE && t < 23.2) {
    const fade = 1 - prog(t, 22.6, 23.2);
    for (const p of dust) {
      const a = t - p.t0; if (a < 0 || a > p.life) continue;
      const x = p.x + p.vx * a + Math.sin(a * 3 + p.ph) * 10, y = p.y + p.vy * a - 55 * a * a;
      ctx.globalAlpha = (a < 0.15 ? a / 0.15 : 1) * (a > p.life - 0.6 ? (p.life - a) / 0.6 : 1) * 0.9 * fade;
      ctx.fillStyle = `rgb(${mixRGB(RED, GREEN, a / 0.35)})`;
      ctx.beginPath(); ctx.arc(x, y, p.s, 0, 6.283); ctx.fill();
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}

/* ---------- Background, camera, grain ---------- */
const bg = $("#bg");
function drawBG(t) {
  const redA = t < 2.0 ? 0.36 : t >= 4.9 && t < 11.4 ? 0.32 * prog(t, 5.0, 6.0) : t >= 16.9 && t < 18.6 ? 0.3 * (1 - prog(t, DISSOLVE, 18.6)) : 0;
  const grnA = t >= 2.0 && t < 4.9 ? 0.22 : t >= 11.4 && t < 16.9 ? 0.1 : t >= 18.0 ? 0.1 + 0.12 * prog(t, 18.0, 19.0) : 0;
  const x1 = 50 + Math.sin(t * 0.35) * 12, y1 = 68 + Math.cos(t * 0.28) * 6, x2 = 50 + Math.cos(t * 0.3) * 18, y2 = 22 + Math.sin(t * 0.4) * 8;
  bg.style.background =
    `radial-gradient(ellipse 70% 40% at ${x1}% ${y1}%, rgba(255,77,46,${redA.toFixed(3)}), transparent 70%),` +
    `radial-gradient(ellipse 75% 42% at ${x2}% ${y2 + 30}%, rgba(61,255,138,${grnA.toFixed(3)}), transparent 70%),` +
    `radial-gradient(ellipse 90% 60% at 50% 30%, #12284C 0%, #0A1A33 60%, #071327 100%)`;
}
const SHAKES = [[0, 34], [0.5, 10], [1.0, 10], [2.1, 12], [2.7, 6], [3.2, 8], [5.0, 14], [6.8, 16], [7.4, 6], [9.4, 8], [11.6, 10], [12.0, 6], [15.0, 14], [15.5, 12], [16.95, 10], [19.5, 6], [20.0, 8], [23.5, 18], [24.0, 16], [28.0, 24]];
const cam = $("#cam");
function drawCam(t) {
  const [sx, sy, rot] = AD.shake(t, SHAKES);
  const drift = 1 + 0.006 * Math.sin(t * 0.7);
  cam.style.transform = `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) rotate(${rot.toFixed(3)}deg) scale(${drift.toFixed(4)})`;
}
const drawGrain = AD.makeGrain($("#grain"));

/* ---------- Per-frame procedural layer ---------- */
const dollars = $("#dollars"), arrow = $("#arrow");
function pings(rings, t, from, until) {
  rings.forEach((r, i) => {
    const a = t - from - i * 0.33;
    if (a < 0 || t > until) { r.setAttribute("opacity", 0); return; }
    const ph = a % 1.0;
    r.setAttribute("r", (10 + ph * 110).toFixed(1)); r.setAttribute("opacity", (0.9 * (1 - ph)).toFixed(3));
  });
}
function frame(t) {
  tl.seek(Math.max(t, 1e-4), false); // a seek to exactly 0 renders nothing, and frame 0 is the hook
  drawBG(t); drawCam(t);

  if (t < 5) chartH.update(t, 2.25, 4.3);

  if (t > 4.9 && t < 11.7) {
    const h = bB.H * prog(t, 5.0, 5.45, "back.out(1.4)");
    bB.grid.setAttribute("opacity", prog(t, 4.95, 5.4) * 0.9);
    bB.update(t, { h, heat: prog(t, 5.3, 6.0), waste: prog(t, 5.6, 6.4), fan: 1 });
    L_30.firstChild.textContent = "~" + Math.round(30 * prog(t, 5.5, 6.8, "power3.out")) + "%";
    pings(meterRings, t, 9.4, 11.4);
  }

  if (t > 11.2 && t < 17.1) AD.updateCheckGrid(grid, t, 12.3, 13.0, 0.4);

  if (t > 16.9 && t < 23.6) {
    const sweep = prog(t, DISSOLVE, DISSOLVE + 1.15, "power1.inOut");
    const heat = 1 - prog(t, DISSOLVE + 0.25, DISSOLVE + 1.45);
    bR.grid.setAttribute("opacity", 0.9);
    bR.update(t, { h: bR.H, heat, waste: 1, fan: heat, sweep });
    dollars.textContent = "$".repeat(t < 17.95 ? 3 : t < 18.45 ? 2 : 1);
    const gk = prog(t, 18.4, 18.8);
    dollars.style.color = mix(RED, "#17B85A", gk);
    arrow.style.color = mix(RED, "#17B85A", gk);
    arrow.style.opacity = prog(t, 17.8, 18.1);
    arrow.style.transform = `translateY(${(8 * Math.sin(t * 12)).toFixed(1)}px)`;
  }

  if (t > 23.5) {
    const g = 0.5 + 0.5 * Math.exp(-Math.max(0, t - 28) * 2.2) * (t > 28 ? 1 : 0);
    L_url.style.textShadow = `0 0 ${(30 + 40 * g).toFixed(0)}px rgba(61,255,138,${(0.45 + 0.4 * g).toFixed(2)})`;
  }

  drawFX(t);
  drawGrain(t);
}

AD.boot({ frame, DUR, audioSrc: "ad-audio-30.m4a" });
})();
</script>
</body>
</html>
